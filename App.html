<script>
(function () {
'use strict';

const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);

// ------------------------------------------------------------ icons (lucide, stroke 2)
const P = {
  search: ['m21 21-4.34-4.34', 'M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16z'],
  sparkles: ['M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z', 'M20 3v4', 'M22 5h-4'],
  file: ['M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z', 'M14 2v4a2 2 0 0 0 2 2h4', 'M10 9H8', 'M16 13H8', 'M16 17H8'],
  link: ['M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71', 'M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'],
  download: ['M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4', 'm7 10 5 5 5-5', 'M12 15V3'],
  alert: ['m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3', 'M12 9v4', 'M12 17h.01'],
  send: ['M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z', 'm21.854 2.147-10.94 10.939'],
  check: ['M20 6 9 17l-5-5'],
  chevR: ['m9 18 6-6-6-6'],
  chevD: ['m6 9 6 6 6-6'],
  x: ['M18 6 6 18', 'm6 6 12 12'],
  home: ['M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8', 'M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'],
  rotate: ['M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8', 'M3 3v5h5'],
  arrowR: ['M5 12h14', 'm12 5 7 7-7 7'],
  arrowUR: ['M7 7h10v10', 'M7 17 17 7'],
  arrowUp: ['m5 12 7-7 7 7', 'M12 19V5'],
  table: ['M12 3v18', 'M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', 'M3 9h18', 'M3 15h18'],
  listOl: ['M10 12h11', 'M10 18h11', 'M10 6h11', 'M4 10h2', 'M4 6h1v4', 'M6 18H4c0-1 2-2 2-3s-1-1.5-2-1'],
  list: ['M3 12h.01', 'M3 18h.01', 'M3 6h.01', 'M8 12h13', 'M8 18h13', 'M8 6h13'],
  heading: ['M6 12h12', 'M6 20V4', 'M18 20V4'],
  pen: ['M12 20h9', 'M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z'],
  plus: ['M5 12h14', 'M12 5v14']
};
const I = (n, s = 20) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style=${{ flexShrink: 0, display: 'block' }}>${P[n].map(d => html`<path key=${d} d=${d} />`)}</svg>`;
const Logo = ({ mark, h }) => html`<span className="ic" dangerouslySetInnerHTML=${{ __html: mark
  ? '<svg viewBox="0 0 217 239" height="' + h + '" style="display:block;height:' + h + 'px;width:auto" role="img" aria-label="Segari" xmlns="http://www.w3.org/2000/svg">' + MARK_PATHS + '</svg>'
  : '<svg viewBox="0 20 940 386" height="' + h + '" style="display:block;height:' + h + 'px;width:auto" role="img" aria-label="Segari" xmlns="http://www.w3.org/2000/svg">' + LOGO_PATHS + '</svg>' }} />`;
const initials = n => String(n).trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
const Avatar = ({ name, size }) => html`<span className="avatar" title=${name} style=${{ width: size, height: size, fontSize: Math.round(size * .36) }}>${initials(name)}</span>`;

// ------------------------------------------------------------ helpers
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtDate = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? Number(m[3]) + ' ' + MON[Number(m[2]) - 1] + ' ' + m[1] : '–'; };
const todayIso = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const typeOf = id => TYPES.find(t => t.id === id) || TYPES[0];
const deptOf = id => DEPTS.find(d => d.id === id);
const revLabel = d => d.versions.length ? String(d.versions[0].rev) : '–';
const docTitle = d => d.code && d.code !== TYPE_SHORT[d.type] && /\d/.test(d.code) ? d.title : (d.code ? d.code + ' - ' : '') + d.title;
const TYPE_SHORT = { sop: 'SOP', ik: 'IK', spec: 'Specbook', safety: 'SOP' };
const applies = d => d.areas.map(x => (deptOf(x) || {}).short).filter(Boolean).join(' · ') || '–';

/** Library row from the sheet → what the UI needs. */
const prepDoc = d => ({ ...d, areas: d.areas || [], keywords: d.keywords || [], versions: d.versions || [] });

/**
 * Splits a body into sections ("# "), each with blocks: h ("## "), steps ("1. "), bullets ("- "), table ("| a | b |"), p.
 * Text before the first "# " becomes its own untitled section, matching the server's chunking.
 */
function parseBody(body, fallbackTitle) {
  const secs = [];
  let cur = null, para = [];
  const sec = title => { cur = { id: 's' + secs.length, title, blocks: [] }; secs.push(cur); };
  const last = () => cur.blocks[cur.blocks.length - 1];
  const flush = () => { if (para.length) { cur.blocks.push({ kind: 'p', text: para.join('\n') }); para = []; } };
  String(body || '').split('\n').forEach(raw => {
    const line = raw.replace(/\s+$/, '');
    if (/^# /.test(line)) { flush(); sec(line.slice(2).trim()); return; }
    if (!cur) { if (!line.trim()) return; sec(fallbackTitle); }
    let m;
    if (!line.trim()) { flush(); return; }
    if (/^## /.test(line)) { flush(); cur.blocks.push({ kind: 'h', text: line.slice(3).trim() }); return; }
    if ((m = /^(\d+)[.)]\s+(.*)$/.exec(line))) { flush(); const b = last(); const it = { n: Number(m[1]), text: m[2] }; if (b && b.kind === 'steps') b.items.push(it); else cur.blocks.push({ kind: 'steps', items: [it] }); return; }
    if ((m = /^[-•]\s+(.*)$/.exec(line))) { flush(); const b = last(); if (b && b.kind === 'bullets') b.items.push(m[1]); else cur.blocks.push({ kind: 'bullets', items: [m[1]] }); return; }
    if (/^\|.*\|$/.test(line)) {
      flush();
      const cells = line.slice(1, -1).split('|').map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) return;
      const b = last();
      if (b && b.kind === 'table') b.rows.push(cells); else cur.blocks.push({ kind: 'table', head: cells, rows: [] });
      return;
    }
    para.push(line);
  });
  flush();
  secs.forEach(s => s.blocks.forEach((b, j) => { b.aid = 'blk-' + s.id + '-' + j; }));
  return secs;
}

/** "**bold**" → <strong>, "[text](https://…)" → a link that opens in a new tab. */
const rich = text => String(text).split(/(\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^\s)]+\))/g).map((part, i) => {
  if (/^\*\*[^*]+\*\*$/.test(part)) return html`<strong key=${i}>${part.slice(2, -2)}</strong>`;
  const m = /^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/.exec(part);
  return m ? html`<a key=${i} className="doc-link" href=${m[2]} target="_blank" rel="noopener noreferrer">${m[1]}</a>` : part;
});

/** "Label: Name | Role; Name | Role" per line. */
const parseSignoff = text => String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
  const i = l.indexOf(':');
  return { label: i > 0 ? l.slice(0, i).trim() : l, people: (i > 0 ? l.slice(i + 1) : '').split(';').map(p => p.split('|').map(x => x.trim())).filter(p => p[0]).map(p => ({ name: p[0], role: p[1] || '' })) };
});

// ------------------------------------------------------------ keyword search
const STOP = new Set('apa yang harus jika dan untuk bagaimana berapa dari ada atau dengan saat tidak sudah pada ini itu bisa kalau mana kapan siapa'.split(' '));
const words = q => q.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 3 && !STOP.has(w));
const docHay = d => (d.code + ' ' + d.title + ' ' + d.short + ' ' + d.keywords.join(' ')).toLowerCase();

function kwSearch(q, docs) {
  const ws = words(q);
  if (!ws.length) return [];
  const secs = [];
  docs.forEach(d => {
    if (!d.versions.length) return;
    parseBody(d.versions[0].body, d.title).forEach(s => {
      const text = (s.title + ' ' + JSON.stringify(s.blocks)).toLowerCase();
      const n = ws.filter(w => text.includes(w)).length;
      if (n) secs.push({ d, s, n });
    });
  });
  const ds = docs.map(d => ({ d, n: ws.filter(w => docHay(d).includes(w)).length })).filter(o => o.n);
  return [...secs.sort((a, b) => b.n - a.n).slice(0, 5), ...ds.sort((a, b) => b.n - a.n).slice(0, 5)];
}

/** Used when Gemini is not configured: point at the closest documents. */
function localAnswer(text, docs) {
  const hits = kwSearch(text, docs).slice(0, 3);
  if (!hits.length) return { intro: 'Saya belum menemukan jawaban pasti di dokumen yang terindeks.', items: ['Coba sebutkan area (PC, DMG, atau FC) dan kategori SKU.', 'Atau tanyakan langsung ke TL/Captain shift Anda.'], note: '', sources: [] };
  return { intro: 'Bagian dokumen yang paling relevan dengan pertanyaan ini:', items: hits.map(h => h.s ? h.d.code + ' · ' + h.s.title : docTitle(h.d)), note: '',
    sources: hits.map(h => ({ docId: h.d.id, sec: h.s ? h.s.id : null, label: h.s ? h.d.code + ' · ' + h.s.title : h.d.code + ' · ' + h.d.short })) };
}

// ------------------------------------------------------------ server bridge
const hasServer = typeof google !== 'undefined' && google.script && google.script.run;
const run = (fn, ...args) => new Promise((ok, fail) => {
  if (!hasServer) return ok(null);
  google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](...args);
});
// Local preview: read the seed the build script drops next to the page.
const loadLibrary = () => hasServer ? run('getLibrary') : fetch('seed.json').then(r => r.json()).catch(() => ({ docs: [], prompts: [] }));

function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text); } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return Promise.resolve();
}

// ------------------------------------------------------------ app
const NEW_WRITER = () => ({ id: '', editing: false, nextRev: 1, title: '', type: 'sop', areas: [], body: '', date: todayIso(), kw: [], kwDraft: '' });
/** Writer state for publishing a new revision of an existing document. */
const EDIT_WRITER = d => ({ id: d.id, editing: true, nextRev: d.versions.length ? Math.max(...d.versions.map(v => v.rev)) + 1 : 1, title: d.title, type: d.type,
  areas: d.areas, body: d.versions.length ? d.versions[0].body : '', date: todayIso(), kw: d.keywords, kwDraft: '' });
const KW_SUGGEST = ['inbound', 'supplier', 'PO', 'karantina', 'defect', 'expired date', 'FEFO', 'putaway'];
const DRAWER_W = 480, DRAWER_MIN = 380;
const drawerMax = () => Math.min(960, window.innerWidth - 80);
const clampW = w => Math.round(Math.max(DRAWER_MIN, Math.min(drawerMax(), w)));
const saveW = w => { try { localStorage.setItem('kb-drawer-w', String(w)); } catch (e) {} };

function App() {
  const [s, setS] = useState({
    step: 'home', homeView: 'search', type: 'sop', dept: null, docId: null, active: 's0', activeSub: null, tocOpen: {}, anim: true,
    q: '', focus: null, homeQ: null, homeAns: null, homeTyping: false, homeTab: 'mancu', browseQ: '',
    chatOpen: false, msgs: [], typing: false, think: null, draft: '', toast: null, w: NEW_WRITER(), saving: false
  });
  const set = patch => setS(p => ({ ...p, ...(typeof patch === 'function' ? patch(p) : patch) }));
  const [docs, setDocs] = useState(null);
  const [prompts, setPrompts] = useState([]);
  const [vw, setVw] = useState(window.innerWidth);
  const [drawerW, setDrawerW] = useState(() => { try { return Number(localStorage.getItem('kb-drawer-w')) || DRAWER_W; } catch (e) { return DRAWER_W; } });
  const [dragging, setDragging] = useState(false);
  const hdrRef = useRef(), heroRef = useRef(), browseRef = useRef(), headRef = useRef(), bodyRef = useRef(), bodyInputRef = useRef();
  const timers = useRef({}), askSeq = useRef(0);
  const sRef = useRef(s); sRef.current = s;
  const lib = docs || [];
  const docsRef = useRef(lib); docsRef.current = lib;
  const findDoc = id => docsRef.current.find(d => d.id === id);

  // ---- navigation
  const go = (patch, after) => {
    set({ ...patch, anim: false });
    window.scrollTo({ top: 0 });
    requestAnimationFrame(() => requestAnimationFrame(() => { set({ anim: true }); if (after) after(); }));
  };
  const hdrH = () => (hdrRef.current ? hdrRef.current.offsetHeight : 65);
  const scrollToSec = id => { const el = document.getElementById('sec-' + id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - hdrH() - 75, behavior: 'smooth' }); set({ active: id }); };
  const scrollToEl = id => { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - hdrH() - 45, behavior: 'smooth' }); set({ activeSub: id }); };
  const openDoc = (d, sec) => {
    if (!d) return;
    const cur = sRef.current;
    const dept = d.areas.includes(cur.dept) ? cur.dept : d.areas[0] || null;
    go({ step: 'reader', docId: d.id, type: d.type, dept, active: 's0', activeSub: null, tocOpen: {}, q: '' }, sec ? () => setTimeout(() => scrollToSec(sec), 320) : null);
    if (hasServer) google.script.history.replace(null, { doc: d.id });
  };
  const goHome = () => { go({ step: 'home', homeView: 'search', docId: null, q: '', homeQ: null, homeAns: null, homeTyping: false }); if (hasServer) google.script.history.replace(null, {}); };
  const goBrowse = () => go({ step: 'home', homeView: 'browse', docId: null });
  const flash = t => { clearTimeout(timers.current.toast); set({ toast: t }); timers.current.toast = setTimeout(() => set({ toast: null }), 2200); };

  // ---- Mancu: Gemini on the server, local document search when no key is set
  const aiMsg = a => ({ ai: true, intro: a.intro, items: a.items || [], note: a.note || '', sources: a.sources || [], error: !!a.error });
  // On a document page Mancu reads that document first; elsewhere it reads every published one.
  const ctxDocId = () => sRef.current.step === 'reader' ? sRef.current.docId : '';
  // What Mancu reads for a question: the open document (or every document) and the sections that match it best.
  const thinkFor = (text, docId) => {
    const pool = docId ? docsRef.current.filter(d => d.id === docId) : docsRef.current.filter(d => d.versions.length);
    const secs = kwSearch(text, pool).filter(h => h.s).slice(0, 3).map(h => h.s.title);
    return { ctx: docId || '', label: docId && pool[0] ? pool[0].title : pool.length + ' dokumen', secs, phase: 0 };
  };
  // Reading steps advance on a timer while Gemini works; the answer replaces them whenever it arrives.
  const startThink = () => {
    stopThink();
    timers.current.think = [700, 1700].map((ms, i) => setTimeout(() => set(p => p.think ? { think: { ...p.think, phase: i + 1 } } : {}), ms));
  };
  const stopThink = () => (timers.current.think || []).forEach(clearTimeout);
  const answer = (text, docId) => run('askMancu', text, docId || '')
    .then(a => a || localAnswer(text, docsRef.current))
    .catch(err => ({ error: true, intro: String((err && err.message) || 'Mancu sedang tidak tersedia. Coba lagi sebentar.').replace(/^(Error|Exception):\s*/, ''), items: [], note: '', sources: [] }));
  const ask = text => {
    text = (text || '').trim();
    if (!text) return;
    const seq = ++askSeq.current, ctx = ctxDocId();
    set(p => ({ chatOpen: true, typing: true, think: thinkFor(text, ctx), draft: '', msgs: [...p.msgs, { user: true, text }] }));
    startThink();
    answer(text, ctx).then(a => { if (seq !== askSeq.current) return; stopThink(); set(p => ({ typing: false, think: null, msgs: [...p.msgs, aiMsg(a)] })); });
  };
  const askHome = text => {
    text = (text || '').trim();
    if (!text) { if (heroRef.current) heroRef.current.focus(); return; }
    const seq = ++askSeq.current;
    set({ q: text, homeQ: text, homeAns: null, homeTyping: true, homeTab: 'mancu', think: thinkFor(text, '') });
    startThink();
    answer(text).then(a => { if (seq !== askSeq.current) return; stopThink(); set({ homeTyping: false, think: null, homeAns: aiMsg(a) }); });
  };
  const openSource = src => { set({ chatOpen: false }); openDoc(findDoc(src.docId), src.sec); };

  // ---- effects
  useEffect(() => {
    const onR = () => setVw(window.innerWidth);
    const onK = e => {
      const tag = e.target.tagName, cur = sRef.current;
      if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA') {
        const r = cur.step === 'home' ? (cur.homeView === 'search' ? heroRef : browseRef) : headRef;
        if (r.current) { e.preventDefault(); r.current.focus(); }
      } else if (e.key === 'Escape') {
        if (tag === 'INPUT' || tag === 'TEXTAREA') e.target.blur();
        else if (cur.chatOpen) set({ chatOpen: false });
      }
    };
    window.addEventListener('resize', onR);
    window.addEventListener('keydown', onK);
    const ro = new ResizeObserver(() => document.documentElement.style.setProperty('--hdr', hdrH() + 'px'));
    if (hdrRef.current) ro.observe(hdrRef.current);
    loadLibrary().then(res => {
      const all = ((res && res.docs) || []).map(prepDoc);
      setPrompts((res && res.prompts) || []);
      docsRef.current = all;
      setDocs(all);
      if (hasServer) google.script.url.getLocation(loc => { const d = all.find(x => x.id === loc.parameter.doc); if (d) openDoc(d, loc.parameter.sec); });
    }).catch(() => { setDocs([]); flash('Dokumen gagal dimuat'); });
    return () => { window.removeEventListener('resize', onR); window.removeEventListener('keydown', onK); ro.disconnect(); };
  }, []);

  const readerDoc = s.step === 'reader' ? findDoc(s.docId) : null;
  // Readers only see the latest revision; older ones live on as changelog entries.
  const readerVer = readerDoc && readerDoc.versions[0];
  const readerSecs = readerVer ? parseBody(readerVer.body, readerDoc.title) : [];

  useEffect(() => {
    if (!readerSecs.length) return;
    const onS = () => {
      const line = hdrH() + 100, above = el => el && el.getBoundingClientRect().top < line;
      let act = readerSecs[0].id, sub = null;
      for (const x of readerSecs) if (above(document.getElementById('sec-' + x.id))) act = x.id;
      // The changelog is short, so it never reaches the line: count it once the page bottoms out.
      if (above(document.getElementById('sec-log')) || (document.getElementById('sec-log') && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4)) act = 'log';
      const cur = readerSecs.find(x => x.id === act);
      if (cur) for (const b of cur.blocks) if (b.kind === 'h' && above(document.getElementById(b.aid))) sub = b.aid;
      if (act !== sRef.current.active || sub !== sRef.current.activeSub) set({ active: act, activeSub: sub });
    };
    window.addEventListener('scroll', onS, { passive: true });
    return () => window.removeEventListener('scroll', onS);
  }, [s.step, s.docId, docs]);

  // A new answer shows from its start (with the question above it); anything else follows the bottom.
  useEffect(() => {
    const el = bodyRef.current;
    if (!el) return;
    const last = s.msgs[s.msgs.length - 1];
    const answers = el.querySelectorAll('.msg-ai');
    const node = last && last.ai && !s.typing && answers[answers.length - 1];
    const from = node && node.previousElementSibling && node.previousElementSibling.classList.contains('msg-user') ? node.previousElementSibling : node;
    el.scrollTop = from ? from.offsetTop - 16 : el.scrollHeight;
  }, [s.msgs, s.typing]);

  // Mancu answers only about the page it was asked on: leaving that page stops the answer.
  useEffect(() => {
    const cur = sRef.current;
    if (!cur.typing || !cur.think || cur.think.ctx === ctxDocId()) return;
    askSeq.current++;
    stopThink();
    set(p => ({ typing: false, think: null, msgs: [...p.msgs, { ai: true, error: true, intro: 'Halaman berubah, jadi jawaban dihentikan. Mancu hanya membaca dokumen yang sedang dibuka. Tanyakan lagi di halaman ini.', items: [], note: '', sources: [] }] }));
  }, [s.step, s.docId]);

  // Warm the server cache the first time the chat opens, so the first answer starts sooner.
  useEffect(() => { if (s.chatOpen && !timers.current.warm) { timers.current.warm = true; run('warmMancu').catch(() => {}); } }, [s.chatOpen]);

  // ---- layout flags
  const xwide = vw >= 1200, wide = vw >= 1024, mid = vw >= 640;
  const showHeaderSearch = s.step === 'list' || s.step === 'reader';
  const isWriter = s.step === 'writer';
  const loading = docs === null;
  const typingEl = html`<div className="typing"><span className="dot"></span>Mancu sedang membaca SOP…</div>`;
  const ctxDoc = s.step === 'reader' ? lib.find(d => d.id === s.docId) : null;
  const readable = lib.filter(d => d.versions.length).length;
  const thinking = t => t && html`
    <div className="thinking" role="status" aria-live="polite">
      ${['Membaca ' + t.label, t.secs.length ? 'Memeriksa ' + t.secs.join(', ') : 'Mencari bagian yang relevan', 'Menyusun jawaban'].slice(0, t.phase + 1).map((label, i) => html`
        <div key=${i} className=${'think-step' + (i < t.phase ? ' done' : '')}>
          <span className="mark">${i < t.phase ? I('check', 12) : html`<span className="dot"></span>`}</span><span>${label}${i < t.phase ? '' : '…'}</span>
        </div>`)}

          const old = baseDoc || { id: 'lokal-' + Date.now(), code: TYPE_SHORT[p.type], short: p.title, pages: '', signoff: '', versions: [] };
          const ver = { rev: w.nextRev, effectiveDate: p.effectiveDate, note: old.versions.length ? 'Pembaruan isi dokumen.' : 'Rilis pertama.', body: p.body };
          return { ...old, ...p, id: old.id, versions: unchanged ? old.versions : [ver, ...old.versions] };
        };
        const d = prepDoc(res || local());
        setDocs(list => [...(list || []).filter(x => x.id !== d.id), d]);
        set({ saving: false, w: NEW_WRITER() });
        flash(unchanged ? 'Perubahan disimpan' : 'Diterbitkan · Rev ' + d.versions[0].rev);
        openDoc(d);
      } else {
        set(p => ({ saving: false, w: { ...p.w, id: res ? res.id : p.w.id } }));
        flash('Draf disimpan');
      }
    }).catch(err => { set({ saving: false }); flash((err && err.message) || 'Gagal menyimpan'); });
  };
  const writer = html`
    <div className="writer">
      <div style=${{ display: 'flex', flexDirection: 'column', gap: 6 }}>
        <span className="eyebrow lg">Mode penulis</span>
        <h1 className="page-title">${w.editing ? 'Perbarui artikel' : 'Tulis artikel'}</h1>
      </div>
      <section className="w-sec">
        <div className="w-head"><span className="n">1</span><b>Artikel</b></div>
        <label className="field"><span>Judul</span>
          <input className="input" value=${w.title} placeholder="mis. Handling Ice Cream" onChange=${e => setW({ title: e.target.value })} />
        </label>
        <div className="field"><span>Jenis dokumen</span>
          <div className="pills">${TYPES.map(t => html`<button key=${t.id} className=${'pill sm' + (w.type === t.id ? ' on' : '')} aria-pressed=${w.type === t.id} onClick=${() => setW({ type: t.id })}>${t.short}</button>`)}</div>
        </div>
        <div className="field"><span>Area</span>
          <div className="pills">${DEPTS.map(d => { const on = w.areas.includes(d.id); return html`<button key=${d.id} className=${'pill sm tint' + (on ? ' on' : '')} aria-pressed=${on}
            onClick=${() => setW(x => ({ areas: on ? x.areas.filter(a => a !== d.id) : [...x.areas, d.id] }))}>${d.short}</button>`; })}</div>
        </div>
        <div className="field"><label htmlFor="w-body">Isi artikel</label>
          <div className="editor">
            <div className="editor-bar" role="toolbar" aria-label="Format isi artikel">
              ${SNIPPETS.map(sn => html`<button key=${sn.label} type="button" className="editor-btn" onClick=${() => insertSnippet(sn.text, sn.select)}>${I(sn.icon, 16)}<span>${sn.label}</span></button>`)}
            </div>
            <textarea id="w-body" ref=${bodyInputRef} className="textarea" value=${w.body} placeholder="Tulis prosedur langkah demi langkah…" onChange=${e => setW({ body: e.target.value })}></textarea>
          </div>
          <span className="helper sm">Tautan: [teks](https://alamat). Tabel: satu baris per baris tabel, kolom dipisah tanda |, baris pertama jadi judul kolom.</span>
        </div>
      </section>
      <section className="w-sec" style=${{ gap: 14 }}>
        <div className="w-head"><span className="n">2</span><b>Versi</b></div>
        <div className="ver-row">
          <span className="ver-rev"><b>Rev ${unchanged ? baseDoc.versions[0].rev : w.nextRev}</b><span className="new">${unchanged ? 'Tidak berubah' : 'Baru'}</span></span>
          ${!unchanged && html`<label className="ver-date"><span>Berlaku mulai</span>
            <input className="input sm" type="date" value=${w.date} aria-label="Tanggal berlaku" onChange=${e => setW({ date: e.target.value })} />
          </label>`}
        </div>
        <div className="auto-log"><span className="spark-tile" style=${{ width: 28, height: 28 }}>${I('sparkles', 14)}</span>
          <span>${unchanged ? 'Isi belum berubah dari Rev ' + baseDoc.versions[0].rev + ', jadi tidak ada revisi baru. Judul, area, dan kata kunci tetap disimpan.'
            : w.editing ? 'Saat diterbitkan, Gemini membandingkan isi ini dengan Rev ' + (baseDoc && baseDoc.versions.length ? baseDoc.versions[0].rev : '') + ' dan menulis catatan perubahannya di Riwayat perubahan.'
            : 'Saat diterbitkan, Gemini menulis ringkasan rilis pertama di Riwayat perubahan.'}</span>
        </div>
      </section>
      <section className="w-sec" style=${{ gap: 14 }}>
        <div className="w-head"><span className="n">3</span><b>Kata kunci untuk Gemini</b></div>
        <span className="helper">Istilah yang dipakai staf saat bertanya. Tekan Enter untuk menambah.</span>
        <div className=${'tagbox' + (s.focus === 'kw' ? ' focus' : '')} onClick=${e => { const inp = e.currentTarget.querySelector('input'); if (e.target === e.currentTarget && inp) inp.focus(); }}>
          ${w.kw.map(k => html`<span key=${k} className="chip-kw">${k}<button aria-label=${'Hapus ' + k} onClick=${() => setW(x => ({ kw: x.kw.filter(y => y !== k) }))}>${I('x', 12)}</button></span>`)}
          <input value=${w.kwDraft} placeholder="mis. karantina, PO hilang" aria-label="Kata kunci"
            onChange=${e => { const v = e.target.value; if (v.includes(',')) { v.split(',').slice(0, -1).forEach(addKw); setW({ kwDraft: v.split(',').pop() }); } else setW({ kwDraft: v }); }}
            onFocus=${() => set({ focus: 'kw' })} onBlur=${() => set(p => p.focus === 'kw' ? { focus: null } : {})}
            onKeyDown=${e => { if (e.key === 'Enter') { e.preventDefault(); addKw(w.kwDraft); } else if (e.key === 'Backspace' && !w.kwDraft && w.kw.length) setW(x => ({ kw: x.kw.slice(0, -1) })); }} />
        </div>
        ${kwSuggest.length > 0 && html`
          <div className="suggest"><span>Saran:</span>${kwSuggest.map(k => html`<button key=${k} className="sug" onClick=${() => addKw(k)}>+ ${k}</button>`)}</div>`}
      </section>
      <div className="w-foot">
        ${w.editing ? html`<button className="btn" disabled=${s.saving} onClick=${() => { const d = baseDoc; set({ w: NEW_WRITER() }); d ? openDoc(d) : goHome(); }}>Batal</button>`
          : html`<button className="btn" disabled=${s.saving} onClick=${() => save('draft')}>Simpan draf</button>`}
        <button className="btn primary" disabled=${s.saving} onClick=${() => save('published')}>${s.saving ? (unchanged ? 'Menyimpan…' : 'Gemini menulis catatan…') : unchanged ? 'Simpan' : w.editing ? 'Terbitkan Rev ' + w.nextRev : 'Terbitkan'}</button>
      </div>
    </div>`;

  // ================================================================= drawer
  // Example questions only on an empty chat, and on a document page only those it can answer.
  const ctxDocNow = s.step === 'reader' ? lib.find(d => d.id === s.docId) : null;
  const nextPrompts = s.typing || s.msgs.length ? [] : prompts.filter(p => !ctxDocNow || kwSearch(p, [ctxDocNow]).some(h => h.s && h.n >= 2));
  const width = clampW(drawerW);
  const startResize = e => {
    e.preventDefault();
    setDragging(true);
    const move = ev => setDrawerW(clampW(window.innerWidth - ev.clientX));
    const up = ev => {
      setDragging(false);
      saveW(clampW(window.innerWidth - ev.clientX));
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  const keyResize = e => {
    const step = e.shiftKey ? 80 : 20;
    const next = e.key === 'ArrowLeft' ? width + step : e.key === 'ArrowRight' ? width - step : e.key === 'Home' ? drawerMax() : e.key === 'End' ? DRAWER_MIN : null;
    if (next == null) return;
    e.preventDefault();
    const w = clampW(next);
    setDrawerW(w); saveW(w);
  };
  const drawer = html`
    ${s.chatOpen && html`<div className="scrim" onClick=${() => set({ chatOpen: false })}></div>`}
    <aside className=${'drawer' + (s.chatOpen ? ' open' : '') + (dragging ? ' dragging' : '')} style=${{ width: mid ? width : '100vw' }} aria-label="Mancu" aria-hidden=${!s.chatOpen}>
      ${mid && html`<div className="d-resize" role="separator" aria-orientation="vertical" aria-label="Ubah lebar panel" title="Seret untuk mengubah lebar"
        tabIndex="0" aria-valuemin=${DRAWER_MIN} aria-valuemax=${drawerMax()} aria-valuenow=${width}
        onPointerDown=${startResize} onKeyDown=${keyResize} onDoubleClick=${() => { setDrawerW(DRAWER_W); saveW(DRAWER_W); }}><span></span></div>`}
      <div className="d-head">
        <span className="d-tile">${I('sparkles', 16)}</span>
        <div className="d-name">
          <b>Mancu</b>
          <span className="d-ctx" title=${ctxDoc ? 'Mancu mengutamakan dokumen yang sedang Anda buka' : 'Mancu membaca semua dokumen yang terbit'}>
            ${loading ? 'Memuat dokumen…' : ctxDoc ? html`Membaca <b>${ctxDoc.title}</b>` : html`Membaca semua SOP · ${readable} dokumen`}
          </span>
        </div>
        <button className="d-btn" title="Chat baru" aria-label="Chat baru" onClick=${() => { askSeq.current++; stopThink(); set({ msgs: [], typing: false, think: null }); }}>${I('rotate', 17)}</button>
        <button className="d-btn" title="Tutup" aria-label="Tutup" onClick=${() => set({ chatOpen: false })}>${I('x', 19)}</button>
      </div>
      <div className="d-body" ref=${bodyRef}>
        ${!s.msgs.length && !s.typing && html`
          <div className="hello"><b>Ada yang bisa dibantu?</b><span>${ctxDoc ? 'Tanyakan apa saja tentang ' + ctxDoc.title + '.' : 'Tanyakan prosedur, batas, atau alur kerja gudang.'} Setiap jawaban menyebut bagian sumbernya.</span></div>`}
        ${s.msgs.map((m, i) => m.user ? html`<div key=${i} className="msg-user">${m.text}</div>` : html`
          <div key=${i} className="msg-ai">
            ${m.error ? html`<span className="msg-note">${m.intro}</span>` : html`<span className="intro">${m.intro}</span>`}
            ${m.items.length > 0 && html`<ol className="ans-list">${m.items.map((t, j) => html`<li key=${j}>${rich(t)}</li>`)}</ol>`}
            ${m.note && html`<span className="msg-note">${m.note}</span>`}
            ${m.sources.length > 0 && html`
              <div className="src-chips">
                ${m.sources.map(src => html`<button key=${src.label} className="src-chip" onClick=${() => openSource(src)}>${I('file', 13)}<span>${src.label}</span></button>`)}
              </div>`}
          </div>`)}
        ${s.typing && thinking(s.think)}
        ${nextPrompts.length > 0 && html`
          <div className="prompt-list">
            <span className="prompt-head">Coba tanyakan</span>
            ${nextPrompts.map(p => html`<button key=${p} className="prompt-row" onClick=${() => ask(p)}><span className="t">${p}</span><span className="ic">${I('arrowUR', 15)}</span></button>`)}
          </div>`}
      </div>
      <form className="composer" onSubmit=${e => { e.preventDefault(); ask(s.draft); }}>
        <div className=${'composer-box' + (s.focus === 'chat' ? ' focus' : '')}>
          <input value=${s.draft} placeholder=${ctxDoc ? 'Tanya tentang ' + ctxDoc.title + '…' : 'Tanya Mancu…'} aria-label="Pertanyaan untuk Mancu" onChange=${e => set({ draft: e.target.value })}
            onFocus=${() => set({ focus: 'chat' })} onBlur=${() => set(p => p.focus === 'chat' ? { focus: null } : {})} />
          <button type="submit" className="send" title="Kirim" aria-label="Kirim" disabled=${!s.draft.trim()}>${I('arrowUp', 18)}</button>
        </div>
        <span className="disclaimer">Mancu bisa salah. Cek kembali di SOP yang dikutip.</span>
      </form>
    </aside>`;

  // ================================================================= page
  const page = s.step === 'home' ? home : s.step === 'list' ? list : s.step === 'reader' ? reader() : writer;
  return html`
    <div style=${{ minHeight: '100vh' }}>
      ${header}
      <main className=${'main' + (s.step === 'reader' ? ' reader' : '')}>
        <div className=${'anim' + (s.anim ? '' : ' out')}>${page}</div>
      </main>
      ${s.step === 'reader' && !s.chatOpen && html`
        <button className="fab" onClick=${() => set({ chatOpen: true })}>
          <span className="c">${I('sparkles', 18)}</span>
          <span className="t"><b>Tanya Mancu AI</b>${mid && html`<span>Asisten SOP gudang</span>`}</span>
        </button>`}
      ${drawer}
      ${s.toast && html`<div className="toast" role="status">${I('check', 18)}<span>${s.toast}</span></div>`}
    </div>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
})();
</script>
