/** A quiet text menu used for the list controls: the selected value is the label, and the menu matches the editor menus. */
function MenuSelect({ label, value, options, accent }) {
  const root = useRef();
  const [open, setOpen] = useState(false);
  const [at, setAt] = useState(0);
  const [alignLeft, setAlignLeft] = useState(false);
  const selected = options.find(o => o.value === value) || options[0];
  const usable = options.filter(o => !o.disabled);
  const show = () => {
    // Keep the menu on screen when the button sits near the left edge of a phone.
    setAlignLeft(root.current.getBoundingClientRect().right < 230);
    setAt(Math.max(0, usable.findIndex(o => o.value === value)));
    setOpen(true);
  };
  useEffect(() => {
    if (!open) return;
    const away = e => { if (root.current && !root.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', away);
    return () => document.removeEventListener('mousedown', away);
  }, [open]);
  const keys = e => {
    if (!open) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); show(); }
      return;
    }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); setOpen(false); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); setAt((at + 1) % usable.length); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); setAt((at - 1 + usable.length) % usable.length); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); usable[at].choose(); setOpen(false); }
  };
  return html`
    <div className="ms" ref=${root} onKeyDown=${keys}>
      <button type="button" className=${'ms-btn' + (accent ? ' accent' : '')} aria-haspopup="listbox" aria-expanded=${open} aria-label=${label + ': ' + selected.label} onClick=${() => open ? setOpen(false) : show()}>

        <div className=${'ms-menu' + (alignLeft ? ' left' : '')} role="listbox" aria-label=${label}>

            </button>`)}

}

const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtDate = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? Number(m[3]) + ' ' + MON[Number(m[2]) - 1] + ' ' + m[1] : '–'; };

const tocLabel = t => String(t).replace(/\*\*|<\/?(?:i|u|mark)>/g, '').replace(/\s*\([^)]*\)\s*$/, '') || String(t);

/** Library row from the sheet → what the UI needs. */

/**
 * Splits a body into sections ("# "), each with blocks: h ("## "), steps ("1. "), bullets ("- "), table ("| a | b |"), p.
 * Text before the first "# " becomes its own untitled section, matching the server's chunking.
 */
function parseBody(body, fallbackTitle) {
  const secs = [];
  let cur = null, para = [];
  const sec = title => { cur = { id: 's' + secs.length, title, blocks: [] }; secs.push(cur); };
  const last = () => cur.blocks[cur.blocks.length - 1];
  const flush = () => { if (para.length) { cur.blocks.push({ kind: 'p', text: para.join('\n') }); para = []; } };
  String(body || '').split('\n').forEach(raw => {
    const line = raw.replace(/\s+$/, '');
    if (/^# /.test(line)) { flush(); sec(line.slice(2).trim()); return; }
    if (!cur) { if (!line.trim()) return; sec(fallbackTitle); }
    let m;
    if (!line.trim()) { flush(); return; }
    if (/^## /.test(line)) { flush(); cur.blocks.push({ kind: 'h', text: line.slice(3).trim() }); return; }
    if ((m = /^(\d+)[.)]\s+(.*)$/.exec(line))) { flush(); const b = last(); const it = { n: Number(m[1]), text: m[2] }; if (b && b.kind === 'steps') b.items.push(it); else cur.blocks.push({ kind: 'steps', items: [it] }); return; }
    if ((m = /^[-•]\s+(.*)$/.exec(line))) { flush(); const b = last(); if (b && b.kind === 'bullets') b.items.push(m[1]); else cur.blocks.push({ kind: 'bullets', items: [m[1]] }); return; }
    if (/^\|.*\|$/.test(line)) {
      flush();
      const cells = line.slice(1, -1).split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) return;
      const b = last();
      if (b && b.kind === 'table') b.rows.push(cells); else cur.blocks.push({ kind: 'table', head: cells, rows: [] });
      return;
    }
    para.push(line);
  });
  flush();
  secs.forEach(s => s.blocks.forEach((b, j) => { b.aid = 'blk-' + s.id + '-' + j; }));
  return secs;
}

/** Photos, line breaks, "**bold**", "<i>", "<u>", "<mark>" and "[text](https://…)" (a link that opens in a new tab), in any nesting. */
const rich = text => String(text).split(/(!\[[^\]]*\]\(https?:\x2F\x2F[^\s)]+\)|<br>|\*\*[^*]+\*\*|<i>.*?<\/i>|<u>.*?<\/u>|<mark>.*?<\/mark>|\[[^\]]+\]\(https?:\x2F\x2F[^\s)]+\))/g).map((part, i) => {
  if (part === '<br>') return html`<br key=${i} />`;
  const img = /^!\[([^\]]*)\]\((https?:\x2F\x2F[^\s)]+)\)$/.exec(part);
  if (img) return html`<img key=${i} className="doc-img" src=${img[2]} alt=${img[1] || 'Foto'} loading="lazy" referrerPolicy="no-referrer" />`;
  if (/^\*\*[^*]+\*\*$/.test(part)) return html`<strong key=${i}>${rich(part.slice(2, -2))}</strong>`;
  const tag = /^<(i|u|mark)>(.*)<\/\1>$/.exec(part);
  if (tag) return React.createElement(tag[1], { key: i }, rich(tag[2]));
  const m = /^\[([^\]]+)\]\((https?:\x2F\x2F[^\s)]+)\)$/.exec(part);
  return m ? html`<a key=${i} className="doc-link" href=${m[2]} target="_blank" rel="noopener noreferrer">${rich(m[1])}</a>` : part;
});

/** "Label: Name | Role; Name | Role" per line. */
const parseSignoff = text => String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
  const i = l.indexOf(':');
  return { label: i > 0 ? l.slice(0, i).trim() : l, people: (i > 0 ? l.slice(i + 1) : '').split(';').map(p => p.split('|').map(x => x.trim())).filter(p => p[0]).map(p => ({ name: p[0], role: p[1] || '' })) };
});

// ------------------------------------------------------------ keyword search
const STOP = new Set('apa yang harus jika dan untuk bagaimana berapa dari ada atau dengan saat tidak sudah pada ini itu bisa kalau mana kapan siapa dilakukan melakukan staf staff cara di ke se ya yg dg dr pd'.split(' '));
const words = q => q.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 2 && !STOP.has(w));
// Two-letter terms such as PO, QC and FC must match whole words, otherwise PO would also find poin and tempo.
const wordPattern = w => w.length < 3 ? '\\b' + w + '\\b' : w;
const hasWord = (text, w) => w.length < 3 ? new RegExp(wordPattern(w)).test(text) : text.includes(w);
const wordAt = (text, w) => w.length < 3 ? text.search(new RegExp(wordPattern(w))) : text.indexOf(w);
const docHay = d => (d.code + ' ' + d.title + ' ' + d.short + ' ' + d.keywords.join(' ')).toLowerCase();

/** A section's readable lines, without markup or link addresses. */
function secLines(sec) {
  const plain = t => String(t).replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/<br>/g, ' ').replace(/\*\*|<\/?(?:i|u|mark)>/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
  const lines = [];
  sec.blocks.forEach(b => {
    if (b.kind === 'p' || b.kind === 'h') lines.push(b.text);
    else if (b.kind === 'steps') b.items.forEach(it => lines.push(it.text));
    else if (b.kind === 'bullets') b.items.forEach(t => lines.push(t));
    else if (b.kind === 'table') [b.head, ...b.rows].forEach(r => lines.push(r.join(' · ')));
  });
  return lines.map(plain);
}

function kwSearch(q, docs, limit = 5) {
  const ws = words(q);
  if (!ws.length) return [];
  const secs = [];
  docs.forEach(d => {
    if (!d.versions.length) return;
    parseBody(d.versions[0].body, d.title).forEach(s => {
      const text = (s.title + ' ' + secLines(s).join(' ')).toLowerCase();
      const n = ws.filter(w => hasWord(text, w)).length;
      if (n) secs.push({ d, s, n });
    });
  });
  const ds = docs.map(d => ({ d, n: ws.filter(w => hasWord(docHay(d), w)).length })).filter(o => o.n);
  return [...secs.sort((a, b) => b.n - a.n).slice(0, limit), ...ds.sort((a, b) => b.n - a.n).slice(0, limit)];
}

/** The section line that matches the most words, trimmed around the first match. */
function excerpt(sec, ws) {
  const lines = secLines(sec);
  const score = l => ws.filter(w => hasWord(l.toLowerCase(), w)).length;
  const text = lines.reduce((b, l) => score(l) > score(b) ? l : b, lines[0] || '');
  const at = Math.max(0, Math.min(...ws.map(w => wordAt(text.toLowerCase(), w)).filter(i => i >= 0), text.length) - 40);
  const cut = text.slice(at, at + 120);
  return (at > 0 ? '…' : '') + cut + (at + 120 < text.length ? '…' : '');
}

/** Wraps the searched words in <mark> so a result shows why it matched. */
const markWords = (text, ws) => ws.length
  ? String(text).split(new RegExp('(' + ws.map(wordPattern).join('|') + ')', 'ig')).map((p, i) => i % 2 ? html`<mark key=${i}>${p}</mark>` : p)
  : text;

/** Used when Gemini is not configured: point at the closest documents. */
function localAnswer(text, docs) {
  const hits = kwSearch(text, docs).slice(0, 3);
  if (!hits.length) return { intro: 'Saya belum menemukan jawaban pasti di dokumen yang terindeks.', items: ['Coba sebutkan area (PC, DMG, atau FC) dan kategori SKU.', 'Atau tanyakan langsung ke TL/Captain shift Anda.'], note: '', sources: [] };
  return { intro: 'Bagian dokumen yang paling relevan dengan pertanyaan ini:', items: hits.map(h => h.s ? h.d.code + ' · ' + h.s.title : docTitle(h.d)), note: '',
    sources: hits.map(h => ({ docId: h.d.id, sec: h.s ? h.s.id : null, label: h.s ? h.d.code + ' · ' + h.s.title : h.d.code + ' · ' + h.d.short })) };
}

// ------------------------------------------------------------ server bridge
const hasServer = typeof google !== 'undefined' && google.script && google.script.run;
const run = (fn, ...args) => new Promise((ok, fail) => {
  if (!hasServer) return ok(null);
  google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](...args);
});
// Local preview: read the seed the build script drops next to the page.
const loadLibrary = () => hasServer ? run('getLibrary') : fetch('seed.json').then(r => r.json()).catch(() => ({ docs: [], prompts: [] }));

function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text); } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return Promise.resolve();
}

// Browser history. Apps Script and the local preview use different calls, the app sees one interface.
const hist = hasServer ? {
  push: (state, params) => google.script.history.push(state, params),
  replace: (state, params) => google.script.history.replace(state, params),
  listen: fn => google.script.history.setChangeHandler(e => fn(e.state))
} : {
  push: (state, params) => window.history.pushState(state, '', params.doc ? '?doc=' + params.doc : location.pathname),
  replace: (state, params) => window.history.replaceState(state, '', params.doc ? '?doc=' + params.doc : location.pathname),
  listen: fn => window.addEventListener('popstate', e => fn(e.state))
};

// Recently opened documents, kept per device.
const AREA_ICONS = { '4r': 'scissors', pc: 'factory', dmg: 'box', fc: 'store', storage: 'warehouse', outbound: 'truck' };
// What Mancu gets to remember: the last three answered questions of this conversation.
const answerText = m => [m.intro, ...m.items, ...(m.table ? [m.table.headers.join(' | '), ...m.table.rows.map(r => r.join(' | '))] : [])].join(' · ');
const recentTurns = msgs => msgs.filter(m => m.ai && !m.error && m.q).slice(-3).map(m => ({ q: m.q, a: answerText(m).slice(0, 600) }));
const RECENT_KEY = 'kb-recent', RECENT_MAX = 3;
const recentIds = () => { try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch (e) { return []; } };
const rememberDoc = id => { try { localStorage.setItem(RECENT_KEY, JSON.stringify([id, ...recentIds().filter(x => x !== id)].slice(0, 10))); } catch (e) {} };
const FRESH_DAYS = 30;
const isFresh = d => {
  const v = d.versions[0], at = v ? Date.parse(v.effectiveDate) : NaN;
  return at <= Date.now() && Date.now() - at <= FRESH_DAYS * 86400000;
};

// ------------------------------------------------------------ app
// `base` is the writer's untouched state: anything different is unsaved work. `edKey` remounts the editor on new content.
const snapW = w => JSON.stringify([w.title, w.type, w.areas, w.body, w.date, w.kw]);
const withBase = w => ({ ...w, base: snapW(w), edKey: Date.now() });
const NEW_WRITER = () => withBase({ id: '', key: 'baru-' + Math.random().toString(36).slice(2, 10), editing: false, nextRev: 1, title: '', type: 'sop', areas: [], body: '', date: todayIso(), kw: [], kwDraft: '' });
/** Writer state for publishing a new revision of an existing document. */
const EDIT_WRITER = d => withBase({ id: d.id, key: 'rev-' + Math.random().toString(36).slice(2, 10), editing: true, nextRev: d.versions.length ? Math.max(...d.versions.map(v => v.rev)) + 1 : 1, title: d.title, type: d.type,
  areas: d.areas, body: d.versions.length ? d.versions[0].body : '', date: todayIso(), kw: d.keywords, kwDraft: '' });
const draftOf = w => ({ key: w.key, docId: w.id, title: w.title, type: w.type, areas: w.areas, date: w.date, keywords: w.kw, body: w.body, savedAt: Date.now() });

// The browser backup: written within a moment of typing, so a closed tab or lost connection loses nothing.
const LOCAL_DRAFT = 'kb-writer:';
const localPut = d => { try { localStorage.setItem(LOCAL_DRAFT + d.key, JSON.stringify(d)); } catch (e) {} };
const localDel = key => { try { localStorage.removeItem(LOCAL_DRAFT + key); } catch (e) {} };
const localAll = () => {
  try { return Object.keys(localStorage).filter(k => k.startsWith(LOCAL_DRAFT)).map(k => JSON.parse(localStorage.getItem(k))).filter(Boolean); } catch (e) { return []; }
};
const newestDrafts = list => {
  const best = {};
  list.forEach(d => { if (!best[d.key] || Number(d.savedAt) > Number(best[d.key].savedAt)) best[d.key] = d; });
  return Object.values(best).sort((a, b) => Number(b.savedAt) - Number(a.savedAt));
};
const fmtWhen = ms => { const d = new Date(Number(ms)); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + String(d.getHours()).padStart(2, '0') + '.' + String(d.getMinutes()).padStart(2, '0'); };

// The editor is a separate bundle fetched on first use, so readers never download it.
let editorLoad = null;
const loadEditor = () => editorLoad || (editorLoad = (hasServer ? run('getEditorBundle') : fetch('EditorBundle.html').then(r => r.text())).then(src => {
  // Apps Script's HTML parser alters raw JavaScript, so the bundle file holds it Base64-encoded (see editor-src/build.mjs).
  const b64 = src.replace(/^[\s\S]*?<script[^>]*>/, '').replace(/<\/script>[\s\S]*$/, '').trim();
  const code = new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
  const script = document.createElement('script');
  script.text = code;
  document.head.appendChild(script);
  // The sandbox may refuse an added script tag; running the code directly is the second way in.
  if (!window.KBEditor) new Function(code)();
  if (!window.KBEditor) throw new Error('Editor tidak terpasang');
  return window.KBEditor;
}).catch(err => { console.error('Editor:', err); editorLoad = null; throw err; }));

const MOD = /Mac|iP(hone|ad)/.test(navigator.platform) ? '⌘' : 'Ctrl+';

// The slash menu. Everything here maps to something the article format can already store.
const SLASH = [
  { id: 'p', group: 'Teks', label: 'Teks biasa', tile: 'T', keys: 'teks biasa paragraf normal text' },
  { id: 'h1', group: 'Teks', label: 'Judul bagian', tile: 'H1', keys: 'judul bagian heading h1 section' },
  { id: 'h2', group: 'Teks', label: 'Subjudul', tile: 'H2', keys: 'subjudul sub judul heading h2' },
  { id: 'ol', group: 'Teks', label: 'Langkah bernomor', icon: 'listOl', keys: 'langkah bernomor nomor urut numbered list ol' },
  { id: 'ul', group: 'Teks', label: 'Poin', icon: 'list', keys: 'poin bullet bulleted list ul' },
  { id: 'table', group: 'Sisipkan', label: 'Tabel', icon: 'table', keys: 'tabel table' },
  { id: 'link', group: 'Sisipkan', label: 'Tautan', icon: 'link', keys: 'tautan link url website' }
];
const TURN_INTO = SLASH.filter(x => x.group === 'Teks');
const slashTile = x => x.icon ? I(x.icon, 15) : x.tile;
// Makes the selected block or blocks this type. Lists cannot hold headings, so anything else leaves the list first.
const setBlock = (chain, id, e) => {
  if (id === 'p') chain.clearNodes();
  else if (id === 'h1' || id === 'h2') chain.clearNodes().setHeading({ level: id === 'h1' ? 1 : 2 });
  else if (id === 'ol' && !e.isActive('orderedList')) chain.toggleOrderedList();
  else if (id === 'ul' && !e.isActive('bulletList')) chain.toggleBulletList();
  return chain.run();
};
// The slash word being typed at the cursor, if any. It must start a line or follow a space, so a word pair like dan-atau written with a slash stays text.
const slashAt = e => {
  const { selection } = e.state, { $from, empty } = selection;
  if (!empty || !$from.parent.isTextblock) return null;
  const m = /(?:^|\s)\x2F([^\s\x2F]*)$/.exec($from.parent.textBetween(0, $from.parentOffset, '\n', '\n'));
  return m ? { from: $from.pos - m[1].length - 1, to: $from.pos, q: m[1].toLowerCase() } : null;
};
// Phones and touch screens keep a fixed toolbar: selecting text and dragging are awkward there.
const touchLayout = () => window.matchMedia('(hover: none), (max-width: 639px)').matches;

// Write the article as it will look: slash menu for blocks, select text to format it. Saves as the plain body text (editor-src, convert.js).
function BodyEditor({ value, onChange, onNotice }) {
  const host = useRef(), stage = useRef(), ed = useRef(), latest = useRef(), linkInput = useRef(), keyHandler = useRef(() => false);
  latest.current = { onChange, onNotice };
  const [, tick] = useState(0);
  const [state, setState] = useState('loading');
  const [link, setLink] = useState(null);
  const [attempt, setAttempt] = useState(0);
  const [loadError, setLoadError] = useState('');
  const [compact, setCompact] = useState(touchLayout);
  const [active, setActive] = useState(0);
  const [dismissed, setDismissed] = useState(null);
  const [hover, setHover] = useState(null);
  const [blockMenu, setBlockMenu] = useState(false);
  const [styleOpen, setStyleOpen] = useState(false);
  const [mouseDown, setMouseDown] = useState(false);
  const openLink = () => { const e = ed.current; if (e) setLink(e.getAttributes('link').href || ''); };
  useEffect(() => {
    let gone = false;
    setState('loading');
    loadEditor().then(K => {
      if (gone) return;
      ed.current = K.create({ element: host.current, body: value,
        onChange: b => { setHover(null); latest.current.onChange(b); }, onNotice: t => latest.current.onNotice(t), onState: () => tick(n => n + 1), onLinkKey: openLink,
        onKeyDown: ev => keyHandler.current(ev) });
      setState('ready');
    }).catch(err => { if (!gone) { setLoadError(String((err && err.message) || err).slice(0, 160)); setState('failed'); } });
    return () => { gone = true; if (ed.current) { ed.current.destroy(); ed.current = null; } };
  }, [attempt]);
  useEffect(() => { if (link !== null && linkInput.current) linkInput.current.focus(); }, [link === null]);
  useEffect(() => {
    const mq = window.matchMedia('(hover: none), (max-width: 639px)'), onMq = () => setCompact(mq.matches);
    mq.addEventListener('change', onMq);
    const onUp = () => setMouseDown(false);
    window.addEventListener('mouseup', onUp);
    return () => { mq.removeEventListener('change', onMq); window.removeEventListener('mouseup', onUp); };
  }, []);
  // Any click elsewhere closes the small menus.
  useEffect(() => {
    if (!blockMenu && !styleOpen) return;
    const close = ev => { if (!ev.target.closest('.ed-pop, .ed-handle, .bb-style')) { setBlockMenu(false); setStyleOpen(false); } };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [blockMenu, styleOpen]);

  const e = ed.current;
  const slashRaw = e && e.isFocused ? slashAt(e) : null;
  useEffect(() => { setActive(0); if (!slashRaw) setDismissed(null); }, [slashRaw && slashRaw.q, !slashRaw]);

  if (state === 'failed') return html`
    <div className="editor">
      <div className="editor-fail"><span>Editor gagal dimuat. Anda tetap bisa menulis dengan format teks di bawah.${loadError ? ' (' + loadError + ')' : ''}</span><button type="button" className="text-btn" onClick=${() => setAttempt(n => n + 1)}>Coba lagi</button></div>
      <textarea className="textarea" value=${value} aria-label="Isi artikel" onChange=${ev => onChange(ev.target.value)}></textarea>
    </div>`;

  const K = window.KBEditor;
  const chain = () => e.chain().focus();
  const on = (...x) => !!e && e.isActive(...x);
  const can = fn => !!e && fn(e.can());
  const inTable = on('table');
  const sel = e ? e.state.selection : null;
  const textSel = !!sel && !sel.empty && !sel.node && !sel.$anchorCell;
  const base = stage.current ? stage.current.getBoundingClientRect() : null;
  const hdr = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hdr'), 10) || 65;

  // ---- the slash menu
  const slash = slashRaw && slashRaw.from !== dismissed ? slashRaw : null;
  const slashItems = !slash ? [] : SLASH.filter(x => (!inTable || x.id === 'link') && (!slash.q || x.keys.split(' ').some(k => k.startsWith(slash.q))));
  const slashIndex = Math.min(active, Math.max(0, slashItems.length - 1));
  const applySlash = item => {
    const c = chain().deleteRange({ from: slash.from, to: slash.to });
    if (item.id === 'table') c.insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run();
    else if (item.id === 'link') { c.run(); openLink(); }
    else setBlock(c, item.id, e);
  };
  keyHandler.current = ev => {
    if (!slash) return false;
    if (ev.key === 'Escape') { setDismissed(slash.from); return true; }
    if (!slashItems.length) return false;
    if (ev.key === 'ArrowDown') { setActive((slashIndex + 1) % slashItems.length); return true; }
    if (ev.key === 'ArrowUp') { setActive((slashIndex - 1 + slashItems.length) % slashItems.length); return true; }
    if (ev.key === 'Enter' || ev.key === 'Tab') { applySlash(slashItems[slashIndex]); return true; }
    return false;
  };

  // ---- text formatting
  const Btn = (icon, label, keys, isOn, run_, enabled = true) => html`
    <button key=${label} type="button" className=${'tb' + (isOn ? ' on' : '')} title=${label + (keys ? ' (' + keys + ')' : '')} aria-label=${label} aria-pressed=${isOn} disabled=${!e || !enabled}
      onMouseDown=${ev => ev.preventDefault()} onClick=${run_}>${I(icon, 17)}</button>`;
  const marks = () => [
    Btn('highlight', 'Sorot', MOD + 'Shift+H', on('highlight'), () => chain().toggleHighlight().run()),
    Btn('bold', 'Tebal', MOD + 'B', on('bold'), () => chain().toggleBold().run()),
    Btn('italic', 'Miring', MOD + 'I', on('italic'), () => chain().toggleItalic().run()),
    Btn('underline', 'Garis bawah', MOD + 'U', on('underline'), () => chain().toggleUnderline().run())
  ];
  const styleId = on('heading', { level: 1 }) ? 'h1' : on('heading', { level: 2 }) ? 'h2' : on('orderedList') ? 'ol' : on('bulletList') ? 'ul' : 'p';
  const applyLink = () => {
    const raw = (link || '').trim();
    if (!raw) { chain().extendMarkRange('link').unsetLink().run(); setLink(null); return; }
    // No slash characters in these patterns: the Apps Script comment stripper can misread them and break the whole app.
    const href = /^https?:\x2F\x2F/i.test(raw) ? raw : 'https://' + raw.replace(/^\x2F+/, '');
    if (e.state.selection.empty && !e.isActive('link')) chain().insertContent({ type: 'text', text: raw, marks: [{ type: 'link', attrs: { href } }] }).run();
    else chain().extendMarkRange('link').setLink({ href }).run();
    setLink(null);
  };
  const linkForm = html`
    <form className="ed-link" onSubmit=${ev => { ev.preventDefault(); applyLink(); }}>
      <input ref=${linkInput} className="input sm" value=${link || ''} placeholder="Tempel alamat tautan" aria-label="Alamat tautan"
        onChange=${ev => setLink(ev.target.value)} onKeyDown=${ev => { if (ev.key === 'Escape') { ev.stopPropagation(); setLink(null); chain().run(); } }} />
      <button type="submit" className="tb-text strong">Terapkan</button>
      ${on('link') && html`<button type="button" className="tb-text danger" onClick=${() => { chain().extendMarkRange('link').unsetLink().run(); setLink(null); }}>Hapus</button>`}
      <button type="button" className="tb-text" onClick=${() => { setLink(null); chain().run(); }}>Batal</button>
    </form>`;
  const TableBtn = (label, run_, danger) => html`<button key=${label} type="button" className=${'tb-text' + (danger ? ' danger' : '')} onMouseDown=${ev => ev.preventDefault()} onClick=${run_}>${label}</button>`;
  const tableBtns = () => [
    TableBtn('+ Baris', () => chain().addRowAfter().run()),
    TableBtn('+ Kolom', () => chain().addColumnAfter().run()),
    TableBtn('Hapus baris', () => chain().deleteRow().run()),
    TableBtn('Hapus kolom', () => chain().deleteColumn().run()),
    TableBtn('Hapus tabel', () => chain().deleteTable().run(), true)
  ];

  // ---- floating pieces, placed relative to the writing area so they scroll with it
  let slashPos = null, bubblePos = null, tablePos = null;
  if (e && base) {
    try {
      if (slash) {
        const c = e.view.coordsAtPos(slash.from), below = c.bottom + 340 < window.innerHeight;
        slashPos = { left: Math.max(8, Math.min(c.left - base.left, base.width - 288)), ...(below ? { top: c.bottom - base.top + 6 } : { bottom: base.bottom - c.top + 6 }) };
      }
      if (!compact && (link !== null || (textSel && e.isFocused && !mouseDown))) {
        const a = e.view.coordsAtPos(sel.from), b = e.view.coordsAtPos(sel.to);
        const mid_ = a.top === b.top ? (a.left + b.left) / 2 : a.left + 120;
        bubblePos = { left: Math.max(8, Math.min(mid_ - base.left - 170, base.width - 440)), top: a.top - 50 < hdr ? b.bottom - base.top + 8 : a.top - base.top - 50 };
      }
      if (!compact && inTable && !bubblePos && e.isFocused) {
        const node = e.view.domAtPos(sel.from).node, cell = node.nodeType === 1 ? node : node.parentElement, table = cell.closest('table');
        if (table) { const r = table.getBoundingClientRect(); tablePos = { left: r.left - base.left, top: r.top - base.top - 44 }; }
      }
    } catch (err) {}
  }

  // ---- the hover handle
  const onStageMove = ev => {
    if (!e || compact || blockMenu || ev.target.closest('.ed-pop')) return;
    const pm = host.current && host.current.querySelector('.pm');
    if (!pm || !stage.current) return;
    // Measured now, not at the last render, because the page may have scrolled since.
    const now = stage.current.getBoundingClientRect();
    const el = [...pm.children].find(c => { const r = c.getBoundingClientRect(); return ev.clientY >= r.top - 8 && ev.clientY <= r.bottom + 8; });
    if (!el) { if (hover) setHover(null); return; }
    let pos;
    try { pos = K.blocks.posOf(e, el); } catch (err) { return; }
    const top = el.getBoundingClientRect().top - now.top;
    if (!hover || hover.pos !== pos || hover.top !== top) setHover({ pos, top, el });
  };
  const hoverNode = e && hover && hover.pos <= e.state.doc.content.size ? e.state.doc.nodeAt(hover.pos) : null;

  return html`
    <div className=${'editor' + (compact ? '' : ' free')}>
      ${compact && html`
        <div className="ed-bars">
          <div className="ed-bar" role="toolbar" aria-label="Format isi artikel">
            ${Btn('undo', 'Urungkan', '', false, () => chain().undo().run(), can(c => c.undo()))}
            ${Btn('redo', 'Ulangi', '', false, () => chain().redo().run(), can(c => c.redo()))}
            <span className="tb-sep"></span>
            <select className="tb-style" aria-label="Gaya teks" value=${styleId} disabled=${!e || inTable} onChange=${ev => setBlock(chain(), ev.target.value, e)}>
              ${TURN_INTO.map(x => html`<option key=${x.id} value=${x.id}>${x.label}</option>`)}
            </select>
            <span className="tb-sep"></span>
            ${marks()}
            ${Btn('link', 'Tautan', '', on('link') || link !== null, () => link !== null ? setLink(null) : openLink())}
            ${Btn('table', 'Sisipkan tabel', '', inTable, () => chain().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run(), !inTable)}
          </div>
          ${link !== null && html`<div className="ed-sub">${linkForm}</div>`}
          ${inTable && html`<div className="ed-sub" role="toolbar" aria-label="Ubah tabel"><span className="ed-sub-l">Tabel</span>${tableBtns()}</div>`}
        </div>`}
      <div ref=${stage} className="ed-stage" onMouseMove=${onStageMove} onMouseDown=${() => setMouseDown(true)} onMouseLeave=${() => { if (!blockMenu && hover) setHover(null); }}>
        ${state === 'loading' && html`<div className="ed-loading" role="status"><span className="dot"></span>Menyiapkan editor…</div>`}
        <div ref=${host} className="ed-host" style=${{ display: state === 'loading' ? 'none' : undefined }}></div>

        ${hoverNode && html`
          <div className="ed-handle" style=${{ top: hover.top }}>
            <button type="button" className="eh-btn" title="Tambah baris di bawah" aria-label="Tambah baris di bawah"
              onMouseDown=${ev => { ev.preventDefault(); ev.stopPropagation(); }} onClick=${() => { K.blocks.addBelow(e, hover.pos); setHover(null); }}>${I('plus', 15)}</button>
            <button type="button" className="eh-btn grip" draggable="true" title="Seret untuk memindahkan, klik untuk menu" aria-label="Menu blok" aria-expanded=${blockMenu}
              onMouseDown=${ev => ev.stopPropagation()} onClick=${() => setBlockMenu(o => !o)}
              onDragStart=${ev => { setBlockMenu(false); K.blocks.startDrag(e, hover.pos, ev.nativeEvent, hover.el); }} onDragEnd=${() => setHover(null)}>
              <svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor" aria-hidden="true"><circle cx="2" cy="2" r="1.5"/><circle cx="8" cy="2" r="1.5"/><circle cx="2" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="2" cy="14" r="1.5"/><circle cx="8" cy="14" r="1.5"/></svg>
            </button>
            ${blockMenu && html`
              <div className="ed-pop block-menu" role="menu">
                ${hoverNode.type.name !== 'table' && html`
                  <span className="sl-group">Ubah menjadi</span>
                  ${TURN_INTO.map(x => html`<button key=${x.id} type="button" className="sl-row" role="menuitem" onMouseDown=${ev => ev.preventDefault()}
                    onClick=${() => { K.blocks.select(e, hover.pos); setBlock(chain(), x.id, e); e.commands.setTextSelection(hover.pos + 1); setBlockMenu(false); setHover(null); }}>
                    <span className="sl-tile">${slashTile(x)}</span><span>${x.label}</span></button>`)}
                  <span className="sl-line"></span>`}
                <button type="button" className="sl-row" role="menuitem" onMouseDown=${ev => ev.preventDefault()} onClick=${() => { K.blocks.duplicate(e, hover.pos); setBlockMenu(false); setHover(null); }}><span>Duplikat</span></button>
                <button type="button" className="sl-row danger" role="menuitem" onMouseDown=${ev => ev.preventDefault()} onClick=${() => { K.blocks.remove(e, hover.pos); setBlockMenu(false); setHover(null); }}><span>Hapus</span></button>
              </div>`}
          </div>`}

        ${slashPos && html`
          <div className="ed-pop slash" style=${slashPos} role="listbox" aria-label="Sisipkan">
            ${slashItems.length ? slashItems.map((x, i) => html`
              ${(i === 0 || slashItems[i - 1].group !== x.group) && html`<span key=${'g' + x.group} className="sl-group">${x.group}</span>`}
              <button key=${x.id} type="button" className=${'sl-row' + (i === slashIndex ? ' on' : '')} role="option" aria-selected=${i === slashIndex}
                onMouseDown=${ev => ev.preventDefault()} onMouseEnter=${() => setActive(i)} onClick=${() => applySlash(x)}>
                <span className="sl-tile">${slashTile(x)}</span><span>${x.label}</span>
              </button>`) : html`<span className="sl-none">Tidak ada hasil</span>`}
          </div>`}

        ${bubblePos && html`
          <div className="ed-pop bubble" style=${bubblePos} role="toolbar" aria-label="Format teks" onMouseDown=${ev => { if (ev.target.tagName !== 'INPUT') ev.preventDefault(); ev.stopPropagation(); }}>
            ${link !== null ? linkForm : html`
              <div className="bb-style">
                <button type="button" className="tb-text" disabled=${inTable} aria-expanded=${styleOpen} onClick=${() => setStyleOpen(o => !o)}>
                  ${TURN_INTO.find(x => x.id === styleId).label}${I('chevD', 14)}
                </button>
                ${styleOpen && html`
                  <div className="ed-pop style-menu" role="menu">
                    ${TURN_INTO.map(x => html`<button key=${x.id} type="button" className=${'sl-row' + (x.id === styleId ? ' on' : '')} role="menuitem" onClick=${() => { setBlock(chain(), x.id, e); setStyleOpen(false); }}>
                      <span className="sl-tile">${slashTile(x)}</span><span>${x.label}</span></button>`)}
                  </div>`}
              </div>
              <span className="tb-sep"></span>
              ${marks()}
              <span className="tb-sep"></span>
              ${Btn('link', 'Tautan', MOD + 'K', on('link'), openLink)}
              ${Btn('eraser', 'Hapus format', '', false, () => chain().unsetAllMarks().run())}`}
          </div>`}

        ${tablePos && html`
          <div className="ed-pop table-bar" style=${tablePos} role="toolbar" aria-label="Ubah tabel" onMouseDown=${ev => { ev.preventDefault(); ev.stopPropagation(); }}>${tableBtns()}</div>`}
      </div>
    </div>`;
}

const KW_SUGGEST = ['inbound', 'supplier', 'PO', 'karantina', 'defect', 'expired date', 'FEFO', 'putaway'];
const DRAWER_W = 480, DRAWER_MIN = 380;
const drawerMax = () => Math.min(960, window.innerWidth - 80);
const clampW = w => Math.round(Math.max(DRAWER_MIN, Math.min(drawerMax(), w)));
const saveW = w => { try { localStorage.setItem('kb-drawer-w', String(w)); } catch (e) {} };

function App() {
  const [s, setS] = useState({
    step: 'home', type: 'all', browseArea: null, browseSort: 'name', dept: null, docId: null, active: 's0', activeSub: null, tocOpen: {}, tocSheet: false, docQs: {}, votes: {}, zoom: null, drafts: [], autosave: null, confirmDiscard: false, anim: true,
    q: '', sq: '', focus: null, fullMsgs: [], fullTyping: false, mq: '', browseQ: '',

        <p>Dijawab langsung dari SOP, lengkap dengan sumbernya.</p>
        ${fullComposer}
        ${prompts.length > 0 && html`
          <div className="mancu-chips">${prompts.map(p => html`<button key=${p} onClick=${() => askFull(p)}>${p}</button>`)}</div>`}

    <div className="full-chat">
      <div className="chat-head">
        <button className="d-btn" title="Beranda" aria-label="Beranda" onClick=${goHome}>${I('chevL', 18)}</button>

      </div>
      <div className="chat-col">

      </div>
      <div className="chat-foot">

  // ================================================================= home
  // One page: search, area cards, recent documents and the full list. Filters also narrow the search.
  const typeMatches = (d, type) => type === 'all' || d.type === type;
  const areaMatches = (d, area) => !area || d.areas.includes(area);
  const scoped = lib.filter(d => typeMatches(d, s.type) && areaMatches(d, s.browseArea));
  const bq = s.browseQ.trim(), bqLow = bq.toLowerCase(), bWs = bq ? words(bq) : [];
  // A title or code containing the exact text comes first, then the sections that mention it.
  const titleHits = bq ? scoped.filter(d => (d.code + ' ' + d.title + ' ' + d.short).toLowerCase().includes(bqLow)) : [];
  const browseHits = !bq ? [] : [
    ...titleHits.map(d => ({ key: d.id, d, sec: null, title: docTitle(d), sub: d.code + ' · ' + typeOf(d.type).short, text: '' })),
    ...keywordHits(bq, scoped, 12).filter(h => h.sec || !titleHits.includes(h.d))
  ];
  const sorted = [...scoped].sort((x, y) => s.browseSort === 'new'
    ? String((y.versions[0] || {}).effectiveDate || '').localeCompare(String((x.versions[0] || {}).effectiveDate || ''))

  const docMeta = d => { const v = d.versions[0]; return d.code + ' · Rev ' + revLabel(d) + ' · Berlaku ' + (v ? fmtDate(v.effectiveDate) : '–'); };
  const docTags = d => [...(isFresh(d) ? [{ label: 'Baru diperbarui', fresh: true }] : []), ...d.areas.map(x => (deptOf(x) || {}).short).filter(Boolean).map(label => ({ label }))];
  const recentDocs = recentIds().map(id => lib.find(d => d.id === id)).filter(Boolean).slice(0, RECENT_MAX);
  const latestDate = lib.map(d => (d.versions[0] || {}).effectiveDate || '').filter(x => x && Date.parse(x) <= Date.now()).sort().pop();
  const filtered = s.type !== 'all' || !!s.browseArea;
  const clearFilters = () => set({ type: 'all', browseArea: null });
  const typeCount = t => lib.filter(d => typeMatches(d, t) && areaMatches(d, s.browseArea)).length;
  const areaCount = x => lib.filter(d => typeMatches(d, s.type) && areaMatches(d, x)).length;
  // Arrow keys: down from the search box into the results, up from the first result back to the box. Enter opens a row.
  const browseKeys = e => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const rows = [...e.currentTarget.querySelectorAll('.row')], at = rows.indexOf(document.activeElement);
    const inBox = e.target === browseRef.current;
    if (!inBox && at < 0) return;
    e.preventDefault();
    if (e.key === 'ArrowDown') { const next = inBox ? rows[0] : rows[at + 1]; if (next) next.focus(); }
    else if (at <= 0) { if (browseRef.current) browseRef.current.focus(); }
    else rows[at - 1].focus();
  };
  const clearSearch = () => { set({ browseQ: '' }); if (browseRef.current) browseRef.current.focus(); };
  const jenisMenu = html`<${MenuSelect} label="Jenis dokumen" value=${s.type} accent=${s.type !== 'all'} options=${[
    { value: 'all', label: 'Semua jenis', count: typeCount('all'), choose: () => set({ type: 'all' }) },
    ...TYPES.map(t => { const c = typeCount(t.id); return { value: t.id, label: t.short, count: c, disabled: !c && s.type !== t.id, choose: () => set({ type: t.id }) }; })
  ]} />`;
  const sortMenu = html`<${MenuSelect} label="Urutkan" value=${s.browseSort} options=${[
    { value: 'name', label: 'Nama A-Z', choose: () => set({ browseSort: 'name' }) },
    { value: 'new', label: 'Terbaru', choose: () => set({ browseSort: 'new' }) }

  const noResults = html`
    <div className="no-results">

  const home = html`
    <div onKeyDown=${browseKeys}>

          </div>

        </div>

      <div className="home-body">

        <section className="home-sec">
          <div className="list-bar">
            <span className="eyebrow lg">${bq ? browseHits.length + ' hasil' : (s.browseArea ? (deptOf(s.browseArea) || {}).short : 'Semua dokumen') + (loading ? '' : ' · ' + sorted.length)}</span>

            <div className="rows">

        </section>

  // ================================================================= search results
  const sHits = s.step === 'search' ? keywordHits(s.sq) : [];
  const sWs = s.step === 'search' ? words(s.sq) : [];
  const searchPage = html`
    <div className="results">
      <nav className="crumbs" aria-label="Breadcrumb">

      <div className="list-head">

      </div>
      ${mancuCard(sHits.length ? 'Belum menemukan jawabannya? Tanya Mancu' : 'Coba tanya Mancu', 'Dijawab langsung dari SOP, lengkap dengan sumbernya.', s.sq)}
    </div>`;

  // ================================================================= reader
  const block = b => {
    switch (b.kind) {
      case 'h': return html`<h3>${rich(b.text)}</h3>`;
      case 'p': return html`<p className="prose">${rich(b.text)}</p>`;
      case 'steps': return html`<ol className="steps">${b.items.map((it, i) => html`<li key=${i}><span>${it.n}.</span><span>${rich(it.text)}</span></li>`)}</ol>`;

      // A table with photos stacks into labelled blocks on a phone, where three columns would be too cramped.
      case 'table': return html`
        <div className=${'tbl' + ([b.head, ...b.rows].some(r => r.some(c => c.includes('!['))) ? ' stack' : '')}><div className="tbl-scroll"><table>
          <thead><tr>${b.head.map((h, i) => html`<th key=${i}>${rich(h)}</th>`)}</tr></thead>
          <tbody>${b.rows.map((r, i) => html`<tr key=${i}>${r.map((c, j) => html`<td key=${j} className=${c ? '' : 'blank'} data-label=${b.head[j] || ''} style=${{ whiteSpace: c.length < 16 ? 'nowrap' : 'normal' }}>${rich(c)}</td>`)}</tr>`)}</tbody>
        </table></div></div>`;
    }
    return null;
  };

  const reader = () => {
    const doc = readerDoc;
    if (!doc) return html`<div className="article"><div className="article-in">${loading ? typingEl : html`<p className="prose">Dokumen tidak ditemukan.</p>`}</div></div>`;
    const docT = typeOf(doc.type), dDept = deptOf(s.dept) || deptOf(doc.areas[0]) || DEPTS[0];
    const vers = doc.versions, viewV = readerVer;
    const secs = readerSecs;
    const showToc = secs.length > 0;
    const toc = [...secs.map(x => ({ id: x.id, label: tocLabel(x.title), full: x.title, on: x.id === s.active,
      subs: x.blocks.filter(b => b.kind === 'h').map(b => ({ aid: b.aid, label: tocLabel(b.text) })) })),
      ...(vers.length ? [{ id: 'log', label: 'Riwayat perubahan', full: 'Riwayat perubahan', on: s.active === 'log', subs: [] }] : [])];
    const curToc = toc.find(t => t.on);
    const signoff = parseSignoff(doc.signoff);
    const cols = showToc && wide ? (xwide ? '264px minmax(0, 1fr)' : '236px minmax(0, 1fr)') : 'minmax(0, 1fr)';
    // A section with sub-headings opens while it is being read; its chevron opens or closes it by hand.
    const tocRow = t => {
      const open = t.subs.length > 0 && (s.tocOpen[t.id] !== undefined ? s.tocOpen[t.id] : t.on);
      return html`
        <div key=${t.id} className="toc-item">
          <button className=${'toc-row' + (t.on && !(open && s.activeSub) ? ' on' : '')} title=${t.full !== t.label ? t.full : undefined} aria-expanded=${t.subs.length ? open : undefined}
            onClick=${() => {
              // A section with sub-headings only opens or closes its list; its sub-headings jump to the text.

            }}>
            <span className="toc-link">${t.label}</span>

        </div>`;
    };
    const deepLink = (window.APP_URL || location.href.split('?')[0].split('#')[0]) + '?doc=' + encodeURIComponent(doc.id);
    const secLink = id => html`<button className="anchor" title="Salin link bagian ini" aria-label="Salin link bagian ini"
      onClick=${() => copyText(deepLink + '&sec=' + id).then(() => flash('Link bagian disalin'))}>${I('link', 18)}</button>`;

    const actions = html`
      <div className="r-actions">
        <button className="btn icon" title="Salin link" aria-label="Salin link" onClick=${() => copyText(deepLink).then(() => flash('Link disalin'))}>${I('link', 17)}</button>
        <button className="btn icon" title="Perbarui dokumen" aria-label="Perbarui dokumen" onClick=${() => go({ step: 'writer', w: EDIT_WRITER(doc) })}>${I('pen', 17)}</button>
        ${vers.length > 0 && html`<button className="btn icon" title="Unduh PDF" aria-label="Unduh PDF" onClick=${() => window.print()}>${I('download', 17)}</button>`}
      </div>`;

    return html`
      <div className="reader-grid" style=${{ gridTemplateColumns: cols }}>
        ${showToc && wide && html`
          <div className="sidetoc"><aside>
            <span className="eyebrow">Di halaman ini</span>

          </aside></div>`}
        <article className="article" onClick=${e => { if (e.target.classList.contains('doc-img')) set({ zoom: e.target.src }); }} style=${{ padding: wide ? '28px 56px 96px' : mid ? '24px 32px 60px' : undefined }}>
          <div className="article-in">
            <div className="r-top">
              <nav className="crumbs" aria-label="Breadcrumb">
                <button className="crumb" onClick=${goHome} aria-label="Beranda" style=${{ width: 36, justifyContent: 'center', padding: 0 }}>${I('home', 18)}</button><span className="sep">›</span>
                <button className="crumb" onClick=${() => goBrowse(doc.type)}>${docT.short}</button><span className="sep">›</span>
                <button className="crumb" onClick=${() => goBrowse(doc.type, dDept.id)}>${dDept.short}</button>
                ${mid && html`<span className="sep">›</span><span className="crumb-pill">${doc.short}</span>`}
              </nav>
              ${!mid && actions}
            </div>
            <div className="r-head">
              <div className="r-head-t">
                ${mid && html`<span className="eyebrow lg">${docT.long}</span>`}
                <h1 className="r-title">${docTitle(doc)}</h1>
              </div>
              ${mid && actions}
            </div>
            ${mid ? html`
              <dl className="r-facts">
                <div><dt>Kode dokumen</dt><dd className="code">${doc.code}</dd></div>
                <div><dt>Berlaku sejak</dt><dd>${viewV ? fmtDate(viewV.effectiveDate) : '–'}</dd></div>
                ${vers.length > 0 && html`<div><dt>Revisi</dt><dd>Rev ${viewV.rev}</dd></div>`}
                ${doc.pages && html`<div><dt>Halaman</dt><dd>${doc.pages}</dd></div>`}
                <div className="wide"><dt>Berlaku untuk</dt><dd>${applies(doc)}</dd></div>
              </dl>` : html`
              <p className="r-line"><b>${doc.code}</b>${vers.length > 0 ? ' · Rev ' + viewV.rev : ''}${viewV ? ' · ' + fmtDate(viewV.effectiveDate) : ''} · ${applies(doc)}</p>`}
            ${showToc && !wide && html`
              <button className="toc-bar" aria-haspopup="dialog" onClick=${() => set({ tocSheet: true })}>
                ${I('list', 16)}<b>Daftar isi</b><span>${curToc ? curToc.label : ''}</span>${I('chevD', 16)}
              </button>`}
            ${secs.length ? html`
              ${secs.map(sec => html`
                <section key=${sec.id} id=${'sec-' + sec.id} className="sec">
                  ${sec.title !== doc.title && html`<h2 className="sec-h">${secLink(sec.id)}<span>${sec.title}</span></h2>`}
                  ${sec.blocks.map(b => html`<div key=${b.aid} id=${b.aid} className="blk">${block(b)}</div>`)}
                </section>`)}
              ${signoff.length > 0 && html`
                <section className="signoff">
                  <span className="eyebrow lg">Persetujuan dokumen</span>
                  <div className="signoff-grid">
                    ${signoff.map(g => html`
                      <div key=${g.label} className="signoff-col"><b>${g.label}</b>
                        ${g.people.map(p => html`<span key=${p.name} className="person"><${Avatar} name=${p.name} size=${32} /><span className="user-t"><b>${p.name}</b><span>${p.role}</span></span></span>`)}
                      </div>`)}
                  </div>
                </section>`}
              <section id="sec-log" className="sec changelog">
                <h2 className="sec-h">${secLink('log')}<span>Riwayat perubahan</span></h2>
                ${vers.map((v, i) => html`
                  <div key=${i} className="log-entry">
                    <h3>Rev ${v.rev}${i === 0 ? ' (Terbaru)' : ''}</h3>
                    <div className="log-date"><b>${fmtDate(v.effectiveDate)}</b></div>
                    ${v.note ? html`<ul className="bullets">${v.note.split('\n').map(l => l.replace(/^[-•]\s*/, '').trim()).filter(Boolean).map((t, j) => html`<li key=${j}><span>•</span><span>${rich(t)}</span></li>`)}</ul>`
                      : html`<p className="log-empty">Belum ada catatan perubahan.</p>`}
                  </div>`)}
              </section>` : html`
              <div className="notfull">
                <b>Belum didigitalkan</b>
                <p className="prose">Isi dokumen ini belum dimasukkan ke Knowledge Base. Tambahkan revisinya di sheet Versi, atau tulis lewat Mode penulis.</p>
              </div>`}
          </div>
        </article>
        ${s.tocSheet && !wide && html`
          <div className="scrim" onClick=${() => set({ tocSheet: false })}></div>

            <div className="sheet-head"><b>Daftar isi</b><button className="d-btn" title="Tutup" aria-label="Tutup" onClick=${() => set({ tocSheet: false })}>${I('x', 19)}</button></div>
            <nav className="toc" aria-label="Daftar isi">${toc.map(tocRow)}</nav>
          </div>`}
      </div>`;
  };

  // ================================================================= writer
  const w = s.w;
  const setW = patch => set(p => ({ w: { ...p.w, ...(typeof patch === 'function' ? patch(p.w) : patch) } }));
  const addKw = t => setW(x => { t = String(t).trim(); return { kw: t && !x.kw.some(k => k.toLowerCase() === t.toLowerCase()) ? [...x.kw, t] : x.kw, kwDraft: '' }; });
  const kwSuggest = KW_SUGGEST.filter(k => !w.kw.some(x => x.toLowerCase() === k.toLowerCase())).slice(0, 5);
  const payload = () => ({ id: w.id, title: w.title.trim(), type: w.type, areas: w.areas, body: w.body, effectiveDate: w.date, keywords: w.kw });
  const baseDoc = w.editing ? findDoc(w.id) : null;
  const unchanged = !!baseDoc && baseDoc.versions.length > 0 && baseDoc.versions[0].body.trim() === w.body.trim();
  const dirty = s.step === 'writer' && snapW(w) !== w.base;
  // Autosave: this device right away, the shared Draf sheet a few seconds after typing stops. Requests run one at a time.
  const pendingDraft = useRef(null), draftQueue = useRef(Promise.resolve());
  const pushDraft = d => {
    pendingDraft.current = null;
    set({ autosave: { st: 'saving' } });
    draftQueue.current = draftQueue.current.then(() => run('saveDraft', d)).then(() => {
      set(p => p.autosave && p.autosave.st === 'saving' ? { autosave: { st: 'saved', at: d.savedAt } } : {});
    }, err => { set({ autosave: { st: 'local', msg: /panjang/.test((err && err.message) || '') ? err.message : '' } }); });
  };
  const removeDraft = key => {
    pendingDraft.current = null;
    localDel(key);
    set(p => ({ autosave: null, drafts: p.drafts.filter(d => d.key !== key) }));
    draftQueue.current = draftQueue.current.then(() => run('deleteDraft', key)).catch(() => {});
  };
  const wSnap = s.step === 'writer' ? snapW(w) + w.key : '';
  useEffect(() => {
    if (s.step !== 'writer') return;
    if (!dirty) { if (s.autosave) removeDraft(w.key); return; }
    const d = draftOf(w);
    pendingDraft.current = d;
    if (!s.autosave || s.autosave.st !== 'saving') set({ autosave: { st: 'saving' } });
    const toDevice = setTimeout(() => localPut(d), 300), toSheet = setTimeout(() => pushDraft(d), 4000);
    return () => { clearTimeout(toDevice); clearTimeout(toSheet); };
  }, [wSnap]);
  // Leaving the writer or closing the tab saves whatever the timers hadn't got to yet.
  const flushDraft = () => { const d = pendingDraft.current; if (d) { localPut(d); pushDraft(d); } };
  useEffect(() => {
    const onHide = () => { if (pendingDraft.current) localPut(pendingDraft.current); };
    window.addEventListener('pagehide', onHide);
    document.addEventListener('visibilitychange', onHide);
    return () => { window.removeEventListener('pagehide', onHide); document.removeEventListener('visibilitychange', onHide); };
  }, []);
  // Drafts to offer: this device's at once, then merged with the shared sheet.
  useEffect(() => {
    if (s.step !== 'writer') { flushDraft(); return; }
    set({ drafts: newestDrafts(localAll()), confirmDiscard: false, autosave: null });
    let gone = false;
    draftQueue.current.then(() => run('listDrafts')).then(list => {
      if (!gone && list) set({ drafts: newestDrafts([...localAll(), ...list]) });
    }).catch(() => {});
    return () => { gone = true; };
  }, [s.step]);
  const restoreDraft = d => {
    const doc = d.docId ? findDoc(d.docId) : null;
    const base = doc ? EDIT_WRITER(doc) : NEW_WRITER();
    set({ w: { ...base, key: d.key, title: d.title, type: d.type, areas: d.areas, date: d.date || todayIso(), kw: d.keywords || [], body: d.body, restored: true } });
  };
  const leaveWriter = () => { const d = baseDoc; if (dirty) flash('Draf tetap tersimpan'); set({ w: NEW_WRITER() }); d ? openDoc(d) : goHome(); };
  const discardChanges = () => {
    const key = w.key, doc = baseDoc;
    removeDraft(key);
    set({ confirmDiscard: false, w: doc ? EDIT_WRITER(doc) : NEW_WRITER() });
    flash('Perubahan dibuang');
  };
  const publish = () => {
    if (!w.title.trim()) { flash('Isi judul artikel dulu'); return; }
    // The document list is grouped by area, so an article without one would be invisible.
    if (!w.areas.length) { flash('Pilih minimal satu area'); return; }
    if (s.saving) return;
    const key = w.key;
    set({ saving: true });
    run('saveArticle', payload(), 'published').then(res => {
      const p = payload();
      // Local preview has no server: fake the revision the server would add.
      const local = () => {
        const old = baseDoc || { id: 'lokal-' + Date.now(), code: TYPE_SHORT[p.type], short: p.title, pages: '', signoff: '', versions: [] };
        const ver = { rev: w.nextRev, effectiveDate: p.effectiveDate, note: old.versions.length ? 'Pembaruan isi dokumen.' : 'Rilis pertama.', body: p.body };
        return { ...old, ...p, id: old.id, versions: unchanged ? old.versions : [ver, ...old.versions] };
      };
      const d = prepDoc(res || local());
      setDocs(list => [...(list || []).filter(x => x.id !== d.id), d]);
      // Publishing a document clears every draft of it, not only this session's.
      [key, ...s.drafts.filter(x => w.id && x.docId === w.id).map(x => x.key)].forEach(removeDraft);
      set({ saving: false, w: NEW_WRITER() });
      flash(unchanged ? 'Perubahan disimpan' : 'Diterbitkan · Rev ' + d.versions[0].rev);
      openDoc(d);
    }).catch(err => { set({ saving: false }); flash((err && err.message) || 'Gagal menyimpan'); });
  };
  const offered = s.drafts.filter(d => d.key !== w.key || !w.restored);
  const docDraft = w.editing && !w.restored && !dirty ? offered.find(d => d.docId === w.id && (d.body !== w.body || d.title !== w.title)) : null;
  const newDrafts = !w.editing && !dirty ? offered.filter(d => d.title || d.body) : [];
  const saveNote = !s.autosave ? null : s.autosave.st === 'saving' ? 'Menyimpan…' : s.autosave.st === 'saved' ? 'Tersimpan ' + fmtWhen(s.autosave.at).split(' ').pop()
    : s.autosave.msg || 'Tersimpan di perangkat ini saja, koneksi bermasalah';
  const writer = html`
    <div className="writer">
      <div className="w-top">
        <div style=${{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <span className="eyebrow lg">Mode penulis</span>
          <h1 className="page-title">${w.editing ? 'Perbarui artikel' : 'Tulis artikel'}</h1>
        </div>
        ${dirty && html`
          <div className="w-status" role="status">
            <span className=${s.autosave && s.autosave.st === 'local' ? 'warn' : ''}>${saveNote}</span>
            ${s.confirmDiscard ? html`
              <button type="button" className="tb-text danger" onClick=${discardChanges}>Ya, buang</button>
              <button type="button" className="tb-text" onClick=${() => set({ confirmDiscard: false })}>Batal</button>`
              : html`<button type="button" className="tb-text" onClick=${() => set({ confirmDiscard: true })}>Buang perubahan</button>`}
          </div>`}
      </div>
      ${docDraft && html`
        <div className="draft-note" role="status">
          <span>Ada perubahan belum diterbitkan dari <b>${fmtWhen(docDraft.savedAt)}</b>.</span>
          <button type="button" className="tb-text strong" onClick=${() => restoreDraft(docDraft)}>Lanjutkan</button>
          <button type="button" className="tb-text" onClick=${() => removeDraft(docDraft.key)}>Buang</button>
        </div>`}
      ${newDrafts.length > 0 && html`
        <section className="w-drafts">
          <span className="eyebrow lg">Lanjutkan draf</span>
          <div className="rows">
            ${newDrafts.map(d => html`
              <div key=${d.key} className="draft-row">
                <${Row} title=${d.title || 'Tanpa judul'} meta=${(d.docId ? 'Pembaruan dokumen · ' : 'Artikel baru · ') + 'disimpan ' + fmtWhen(d.savedAt)} onClick=${() => restoreDraft(d)} />
                <button type="button" className="icon-btn" title="Buang draf" aria-label=${'Buang draf ' + (d.title || 'tanpa judul')} onClick=${() => removeDraft(d.key)}>${I('x', 17)}</button>
              </div>`)}
          </div>
        </section>`}
      <section className="w-sec">
        <div className="w-head"><span className="n">1</span><b>Artikel</b></div>
        <label className="field"><span>Judul</span>
          <input className="input" value=${w.title} placeholder="mis. Handling Ice Cream" onChange=${e => setW({ title: e.target.value })} />
        </label>
        <div className="field"><span>Jenis dokumen</span>
          <div className="pills">${TYPES.map(t => html`<button key=${t.id} className=${'pill sm' + (w.type === t.id ? ' on' : '')} aria-pressed=${w.type === t.id} onClick=${() => setW({ type: t.id })}>${t.short}</button>`)}</div>
        </div>
        <div className="field"><span>Area</span>
          <div className="pills">${DEPTS.map(d => { const on = w.areas.includes(d.id); return html`<button key=${d.id} className=${'pill sm tint' + (on ? ' on' : '')} aria-pressed=${on}
            onClick=${() => setW(x => ({ areas: on ? x.areas.filter(a => a !== d.id) : [...x.areas, d.id] }))}>${d.short}</button>`; })}</div>
        </div>
        <div className="field"><span>Isi artikel</span>
          <${BodyEditor} key=${w.edKey} value=${w.body} onChange=${b => setW({ body: b })} onNotice=${flash} />
        </div>
      </section>
      <section className="w-sec" style=${{ gap: 14 }}>
        <div className="w-head"><span className="n">2</span><b>Versi</b></div>
        <div className="ver-row">
          <span className="ver-rev"><b>Rev ${unchanged ? baseDoc.versions[0].rev : w.nextRev}</b><span className="new">${unchanged ? 'Tidak berubah' : 'Baru'}</span></span>
          ${!unchanged && html`<label className="ver-date"><span>Berlaku mulai</span>
            <input className="input sm" type="date" value=${w.date} aria-label="Tanggal berlaku" onChange=${e => setW({ date: e.target.value })} />
          </label>`}
        </div>
        <div className="auto-log"><span className="spark-tile" style=${{ width: 28, height: 28 }}>${I('sparkles', 14)}</span>
          <span>${unchanged ? 'Isi belum berubah dari Rev ' + baseDoc.versions[0].rev + ', jadi tidak ada revisi baru. Judul, area, dan kata kunci tetap disimpan.'
            : w.editing ? 'Saat diterbitkan, Gemini membandingkan isi ini dengan Rev ' + (baseDoc && baseDoc.versions.length ? baseDoc.versions[0].rev : '') + ' dan menulis catatan perubahannya di Riwayat perubahan.'
            : 'Saat diterbitkan, Gemini menulis ringkasan rilis pertama di Riwayat perubahan.'}</span>
        </div>
      </section>
      <section className="w-sec" style=${{ gap: 14 }}>
        <div className="w-head"><span className="n">3</span><b>Kata kunci untuk Gemini</b></div>
        <span className="helper">Istilah yang dipakai staf saat bertanya. Tekan Enter untuk menambah.</span>
        <div className=${'tagbox' + (s.focus === 'kw' ? ' focus' : '')} onClick=${e => { const inp = e.currentTarget.querySelector('input'); if (e.target === e.currentTarget && inp) inp.focus(); }}>
          ${w.kw.map(k => html`<span key=${k} className="chip-kw">${k}<button aria-label=${'Hapus ' + k} onClick=${() => setW(x => ({ kw: x.kw.filter(y => y !== k) }))}>${I('x', 12)}</button></span>`)}
          <input value=${w.kwDraft} placeholder="mis. karantina, PO hilang" aria-label="Kata kunci"
            onChange=${e => { const v = e.target.value; if (v.includes(',')) { v.split(',').slice(0, -1).forEach(addKw); setW({ kwDraft: v.split(',').pop() }); } else setW({ kwDraft: v }); }}
            onFocus=${() => set({ focus: 'kw' })} onBlur=${() => set(p => p.focus === 'kw' ? { focus: null } : {})}
            onKeyDown=${e => { if (e.key === 'Enter') { e.preventDefault(); addKw(w.kwDraft); } else if (e.key === 'Backspace' && !w.kwDraft && w.kw.length) setW(x => ({ kw: x.kw.slice(0, -1) })); }} />
        </div>
        ${kwSuggest.length > 0 && html`
          <div className="suggest"><span>Saran:</span>${kwSuggest.map(k => html`<button key=${k} className="sug" onClick=${() => addKw(k)}>+ ${k}</button>`)}</div>`}
      </section>
      <div className="w-foot">
        <button className="btn" disabled=${s.saving} onClick=${leaveWriter}>${w.editing ? 'Batal' : 'Tutup'}</button>
        <button className="btn primary" disabled=${s.saving} onClick=${publish}>${s.saving ? (unchanged ? 'Menyimpan…' : 'Gemini menulis catatan…') : unchanged ? 'Simpan' : w.editing ? 'Terbitkan Rev ' + w.nextRev : 'Terbitkan'}</button>
      </div>
    </div>`;

  // ================================================================= drawer
  // Example questions only on an empty chat, and on a document page only those it can answer.
  const ctxDocNow = s.step === 'reader' ? lib.find(d => d.id === s.docId) : null;
  const docQs = ctxDocNow ? s.docQs[ctxDocNow.id] : null;
  const pagePrompts = ctxDocNow ? docQs || [] : prompts;
  const quiet = s.typing || s.msgs.length > 0;
  const nextPrompts = quiet ? [] : pagePrompts;
  const promptsPending = !quiet && ctxDocNow && ctxDocNow.versions.length > 0 && !docQs;
  // Answer the page's example questions in the background while the chat sits open, so a click answers at once.
  useEffect(() => {
    if (!s.chatOpen || s.msgs.length || s.typing || !hasServer) return;
    const ctx = ctxDocId();
    const t = setTimeout(() => pagePrompts.slice(0, 3).forEach(q => answer(q, ctx)), 800);
    return () => clearTimeout(t);
  }, [s.chatOpen, s.docId, s.step, pagePrompts.join('|')]);
  const width = clampW(drawerW);
  const startResize = e => {
    e.preventDefault();
    setDragging(true);
    const move = ev => setDrawerW(clampW(window.innerWidth - ev.clientX));
    const up = ev => {
      setDragging(false);
      saveW(clampW(window.innerWidth - ev.clientX));
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  const keyResize = e => {
    const step = e.shiftKey ? 80 : 20;
    const next = e.key === 'ArrowLeft' ? width + step : e.key === 'ArrowRight' ? width - step : e.key === 'Home' ? drawerMax() : e.key === 'End' ? DRAWER_MIN : null;
    if (next == null) return;
    e.preventDefault();
    const w = clampW(next);
    setDrawerW(w); saveW(w);
  };
  const drawer = html`
    ${s.chatOpen && html`<div className="scrim" onClick=${() => set({ chatOpen: false })}></div>`}
    <aside className=${'drawer' + (s.chatOpen ? ' open' : '') + (dragging ? ' dragging' : '')} style=${{ width: mid ? width : 'calc(100vw - var(--edge, 0px))' }} aria-label="Mancu" aria-hidden=${!s.chatOpen}>
      ${mid && html`<div className="d-resize" role="separator" aria-orientation="vertical" aria-label="Ubah lebar panel" title="Seret untuk mengubah lebar"
        tabIndex="0" aria-valuemin=${DRAWER_MIN} aria-valuemax=${drawerMax()} aria-valuenow=${width}
        onPointerDown=${startResize} onKeyDown=${keyResize} onDoubleClick=${() => { setDrawerW(DRAWER_W); saveW(DRAWER_W); }}><span></span></div>`}
      <div className="d-head">
        <span className="d-tile">${I('sparkles', 16)}</span>
        <div className="d-name">
          <b>Mancu</b>
          <span className="d-ctx" title=${ctxDoc ? 'Mancu mengutamakan dokumen yang sedang Anda buka' : 'Mancu membaca semua dokumen yang terbit'}>
            ${loading ? 'Memuat dokumen…' : ctxDoc ? html`Membaca <b>${docName(ctxDoc)}</b>` : html`Membaca semua SOP · ${readable} dokumen`}
          </span>
        </div>
        <button className="d-btn" title="Chat baru" aria-label="Chat baru" onClick=${() => { askSeq.current++; stopThink(); set({ msgs: [], typing: false, think: null }); }}>${I('rotate', 17)}</button>
        <button className="d-btn" title="Tutup" aria-label="Tutup" onClick=${() => set({ chatOpen: false })}>${I('x', 19)}</button>
      </div>
      <div className="d-body" ref=${bodyRef}>
        ${!s.msgs.length && !s.typing && html`
          <div className="hello"><b>Ada yang bisa dibantu?</b><span>${ctxDoc ? 'Tanyakan apa saja tentang ' + docName(ctxDoc) + '.' : 'Tanyakan prosedur, batas, atau alur kerja gudang.'} Setiap jawaban menyebut bagian sumbernya.</span></div>`}
        ${msgNodes(s.msgs)}
        ${s.typing && thinking(s.think)}
        ${promptsPending && html`
          <div className="prompt-list" aria-hidden="true">
            <span className="prompt-head">Coba tanyakan</span>
            <span className="prompt-skel"></span><span className="prompt-skel"></span><span className="prompt-skel"></span>
          </div>`}
        ${nextPrompts.length > 0 && html`
          <div className="prompt-list">
            <span className="prompt-head">Coba tanyakan</span>
            ${nextPrompts.map(p => html`<button key=${p} className="prompt-row" onClick=${() => ask(p)}><span className="t">${p}</span><span className="ic">${I('arrowUR', 15)}</span></button>`)}
          </div>`}
      </div>
      <form className="composer" onSubmit=${e => { e.preventDefault(); ask(s.draft); }}>
        <div className=${'composer-box' + (s.focus === 'chat' ? ' focus' : '')}>
          <input value=${s.draft} placeholder=${ctxDoc ? 'Tanya tentang ' + (TYPE_SHORT[ctxDoc.type] || 'dokumen') + ' ini…' : 'Tanya Mancu…'} aria-label="Pertanyaan untuk Mancu" onChange=${e => set({ draft: e.target.value })}
            onFocus=${() => set({ focus: 'chat' })} onBlur=${() => set(p => p.focus === 'chat' ? { focus: null } : {})} />
          <button type="submit" className="send" title="Kirim" aria-label="Kirim" disabled=${!s.draft.trim()}>${I('arrowUp', 18)}</button>
        </div>
        <span className="disclaimer">Mancu bisa salah. Cek kembali di SOP yang dikutip.</span>
      </form>
    </aside>`;

  // ================================================================= page
  const page = s.step === 'home' ? home : s.step === 'mancu' ? mancuPage : s.step === 'search' ? searchPage : s.step === 'reader' ? reader() : writer;
  return html`
    <div style=${{ minHeight: '100vh' }}>
      ${header}
      <main className=${'main' + (s.step === 'reader' ? ' reader' : s.step === 'home' ? ' flush' : s.step === 'mancu' ? ' flush chat' : '')}>
        <div className=${'anim' + (s.anim ? '' : ' out')}>${page}</div>
      </main>
      ${s.step === 'reader' && !s.chatOpen && html`
        <button className="fab" onClick=${() => set({ chatOpen: true })}>
          <span className="c">${I('sparkles', 18)}</span>
          <b>Tanya Mancu AI</b>
        </button>`}
      ${s.step === 'reader' && drawer}
      ${s.zoom && html`<button className="zoom" aria-label="Tutup foto" onClick=${() => set({ zoom: null })}><img src=${s.zoom} alt="Foto" referrerPolicy="no-referrer" /></button>`}
      ${s.toast && html`<div className="toast" role="status">${I('check', 18)}<span>${s.toast}</span></div>`}
    </div>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
})();
</script>
