<style>
/* Segari FC Dashboard design system: flat, text-first, colour only where it carries meaning. */
:root{--bg:#f4f5f2;--surface:#fff;--subtle:#fafbf9;--ink:#1d211f;--body:#3d4440;--sec:#4a524d;--sec2:#5d6560;--muted:#7a837d;--faint:#9aa39d;--faint2:#c5cbc6;
  --line:#e3e6e1;--ctl:#d5d9d4;--hov:#b9c2bb;--soft:#eef0ec;--soft2:#f3f4f1;--green:#1f5f4a;--green-h:#123d2f;--tint:#eef5f1;--ring:0 0 0 3px rgba(31,95,74,.15);
  --orange:#fa980f;--orange-t:#fdf3e3;--pop:0 8px 24px rgba(20,24,22,.14)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-variant-numeric:tabular-nums}
button{cursor:pointer;color:inherit}
input::placeholder,textarea::placeholder{color:var(--muted)}
h1,h2,h3,p{margin:0}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.eyebrow.lg{font-size:12px;color:var(--sec2)}
.muted{color:var(--muted)}
.page-title{font-size:30px;font-weight:600;line-height:36px;letter-spacing:-.01em}
.ghost{border:0;background:transparent;padding:0}
.ic{display:flex;flex-shrink:0}
.orange{color:var(--orange)}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.hdr-in{padding:10px 32px;display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0;border:0;background:transparent;padding:0;text-align:left}
.brand-t{display:flex;flex-direction:column;border-left:1px solid var(--line);padding-left:12px}
.brand-t b{font-size:16px;font-weight:600;line-height:20px}
.brand-t span{font-size:12px;color:var(--sec2);line-height:16px}
.hdr-mid{position:relative;flex:1;max-width:560px;margin:0 auto}
.hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto}
.hsearch{display:flex;align-items:center;gap:10px;height:46px;padding:0 8px 0 14px;border:1px solid var(--ctl);border-radius:10px;background:var(--subtle);color:var(--sec2)}
.hsearch.focus{border-color:var(--green);box-shadow:var(--ring)}
.hsearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink);height:100%}
.btn-ask{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--ctl);background:#fff;color:var(--green);font-size:13px;font-weight:600;flex-shrink:0}
.btn-ask:hover{border-color:var(--hov)}
.btn-ask .orange{display:flex}
.pop{position:absolute;top:52px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:6px;z-index:40}
.pop .eyebrow{padding:8px 10px 4px}
.pop-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;min-height:44px;width:100%;border:0;background:transparent;text-align:left}
.pop-row:hover{background:var(--bg)}
.pop-row .t{display:flex;flex-direction:column;min-width:0}
.pop-row .t b{font-size:15px;font-weight:500}
.pop-row .t span{font-size:12px;color:var(--sec2)}
.pop-ask{display:flex;align-items:center;gap:10px;padding:12px 10px;margin-top:4px;border:0;border-top:1px solid var(--soft2);background:transparent;width:100%;text-align:left;color:var(--green);font-size:15px;font-weight:500;min-height:44px;border-radius:0 0 8px 8px}
.pop-ask:hover{background:var(--tint)}
.pop-empty{padding:8px 10px;font-size:14px;color:var(--sec2)}
.btn-writer{display:flex;align-items:center;gap:8px;height:38px;min-width:38px;justify-content:center;padding:0 14px;margin-right:6px;border-radius:8px;border:1px solid var(--ctl);background:#fff;color:var(--ink);font-size:14px;font-weight:500}
.btn-writer:hover{border-color:var(--green)}
.btn-writer.on{border-color:var(--green);background:var(--tint);color:var(--green)}
.avatar{border-radius:50%;background:#e4f3ea;color:#194e3d;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.user-t{display:flex;flex-direction:column}
.user-t b{font-size:14px;font-weight:600;line-height:18px}
.user-t span{font-size:12px;color:var(--sec2);line-height:16px}

/* main + page transition */
.main{max-width:1200px;margin:0 auto;padding:32px 32px 120px}
.main.reader{max-width:none;padding:0}
.anim{transition:opacity .3s ease,transform .3s ease}
.anim.out{opacity:0;transform:translateY(8px)}

/* text-link tabs */
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line)}
.tabs.center{justify-content:center}
.tabs.sm{gap:24px}
.tab{display:flex;align-items:baseline;gap:6px;height:44px;padding:0 2px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--sec2);font-size:15px;font-weight:500}
.tab:hover{color:var(--ink)}
.tab.on{border-bottom-color:var(--green);color:var(--ink);font-weight:600}
.tab .n{font-size:12px;color:var(--muted);font-weight:500}

/* home: search */
.hero{display:flex;flex-direction:column;align-items:center;gap:22px;transition:padding-top .3s ease}
.hero-bar{width:100%;max-width:820px;display:flex;align-items:center;gap:12px;height:64px;padding:0 10px 0 22px;border:1px solid var(--ctl);border-radius:14px;background:#fff;color:var(--muted);transition:box-shadow .15s,border-color .15s}
.hero-bar.focus{border-color:var(--green);box-shadow:var(--ring)}
.hero-bar input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:19px;color:var(--ink);height:100%}
.keycap{display:flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-weight:600;color:var(--muted)}
.icon-btn{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.spark-btn{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.spark-btn:hover{background:var(--orange-t)}
.examples{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.ex-link{border:0;background:transparent;padding:2px 0;font-size:15px;line-height:22px;color:var(--sec2)}
.ex-link:hover{color:var(--green);text-decoration:underline}
.results{width:100%;max-width:820px;margin:36px auto 0;display:flex;flex-direction:column}
.ans{display:flex;flex-direction:column;gap:18px;padding-top:28px}
.ans-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;flex-wrap:wrap}
.ans-label .q{font-weight:400;color:var(--muted)}
.ans-intro{font-size:22px;line-height:31px;font-weight:600;text-wrap:pretty}
.numlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.numlist li{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:baseline;font-size:17px;line-height:28px;color:var(--body)}
.numlist li>span:first-child{font-weight:600;color:var(--green)}
.numlist li>span:last-child{text-wrap:pretty}
.ans-note{overflow-wrap:anywhere;font-size:15px;line-height:23px;color:#8a5a0b;padding-left:14px;border-left:2px solid #ecd3a0}
.src-links{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.src-link{display:flex;align-items:center;gap:6px;align-self:flex-start;border:0;background:transparent;padding:4px 0;font-size:15px;font-weight:500;color:var(--green);text-align:left;min-height:32px}
.src-link:hover{text-decoration:underline}
.ans-foot{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line)}
.link-strong{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:4px 0;font-size:15px;font-weight:600;color:var(--ink);min-height:44px}
.link-strong:hover{color:var(--green)}
.disclaimer{font-size:12px;color:var(--muted);line-height:16px}
.typing{align-self:flex-start;display:flex;align-items:center;gap:10px;padding:4px 0;font-size:15px;color:var(--sec2)}
.dot{width:8px;height:8px;border-radius:9999px;background:#2f9e6a;animation:pulse 1.4s ease-in-out infinite;flex-shrink:0}
.dot.ring{box-shadow:0 0 0 3px rgba(47,158,106,.25)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* hairline result rows */
.hl-list{display:flex;flex-direction:column}
.hl-row{display:flex;flex-direction:column;gap:3px;padding:16px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:var(--ink);width:100%}
.hl-row:hover{color:var(--green)}
.hl-row b{font-size:17px;font-weight:500;line-height:24px;text-wrap:pretty}
.hl-row span{font-size:13px;color:var(--muted)}
.empty{padding:16px 0;font-size:15px;color:var(--sec2)}

/* home: browse */
.browse{width:100%;max-width:820px;margin:40px auto 0;display:flex;flex-direction:column;gap:18px}
.field-search{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 16px;border:1px solid var(--ctl);border-radius:10px;background:#fff;color:var(--muted)}
.field-search.focus{border-color:var(--green);box-shadow:var(--ring)}
.field-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink);height:100%}
.field-search .icon-btn{width:34px;height:34px;border-radius:8px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:9999px;border:1px solid var(--ctl);background:#fff;color:var(--ink);font-size:14px;font-weight:500}
.pill:hover{border-color:var(--green)}
.pill .n{font-size:12px;opacity:.7}
.pill.on{background:var(--green);border-color:var(--green);color:#fff}
.pill.sm{height:36px}
.pill.tint.on{background:var(--tint);border-color:var(--green);color:var(--green)}
.area-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.area-row{display:flex;align-items:center;gap:16px;padding:18px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:var(--ink);min-height:44px}
.area-row:hover:not(:disabled){color:var(--green)}
.area-row:disabled{opacity:.45;cursor:not-allowed}
.area-row b{flex:1;font-size:17px;font-weight:500}
.area-row span{font-size:13px;color:var(--muted)}
.area-row i{color:var(--faint);display:flex}

/* breadcrumb */
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:14px;color:var(--sec2)}
.crumbs .sep{color:var(--faint);padding:0 2px}
.crumb{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:var(--sec);font-size:14px}
.crumb:hover{background:var(--bg);color:var(--ink)}
.crumb-pill{padding:6px 12px;border-radius:9999px;background:var(--tint);color:var(--green);font-weight:500}

/* doc list */
.list-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.list-head h1{font-size:28px;font-weight:600;line-height:34px}
.doc-rows{display:flex;flex-direction:column;gap:10px}
.doc-row{display:flex;align-items:center;gap:16px;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:left;min-height:76px;width:100%}
.doc-row:hover{border-color:var(--green);background:var(--subtle)}
.tile{width:44px;height:44px;border-radius:10px;background:var(--bg);color:var(--sec);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.doc-row .t{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.doc-row .t b{font-size:17px;font-weight:600;line-height:22px;text-wrap:pretty}
.doc-row .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--sec2)}
.doc-row .code{font-weight:600;color:var(--green)}
.doc-row i{color:var(--faint);display:flex}

/* reader */
.reader-grid{background:#fff;display:grid;min-height:calc(100vh - var(--hdr,65px))}
.leftnav{border-right:1px solid var(--line)}
.leftnav nav{position:sticky;top:var(--hdr,65px);max-height:calc(100vh - var(--hdr,65px));overflow-y:auto;padding:24px 12px;display:flex;flex-direction:column;gap:2px}
.leftnav .eyebrow{padding:0 12px 10px;color:var(--sec2)}
.side-doc{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border:0;border-radius:8px;background:transparent;min-height:44px}
.side-doc:hover{background:var(--bg)}
.side-doc b{font-size:15px;line-height:21px;color:var(--body);font-weight:400;text-wrap:pretty}
.side-doc span{font-size:12px;color:var(--muted)}
.side-doc.on{background:var(--bg)}
.side-doc.on b{color:var(--green);font-weight:600}
.side-all{display:flex;align-items:center;gap:6px;margin-top:14px;padding:10px 12px;border:0;border-top:1px solid var(--soft2);background:transparent;color:var(--green);font-size:14px;font-weight:500;text-align:left;min-height:44px}
.side-all:hover{color:var(--green-h)}
.article{min-width:0;padding:28px 56px 80px}
.article-in{max-width:980px;margin:0 auto;display:flex;flex-direction:column}
.r-title{margin-top:8px;font-size:clamp(32px,4.2vw,46px);font-weight:650;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.r-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:18px;font-size:15px;color:var(--sec)}
.r-meta .code{font-weight:600;color:var(--green)}
.r-meta .dotsep{color:var(--faint2)}
.rev-wrap{position:relative}
.rev-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px 0 10px;border:1px solid var(--ctl);border-radius:8px;background:#fff;font-size:14px;font-weight:500;color:var(--ink)}
.rev-btn:hover{border-color:var(--hov)}
.rev-pill{font-size:11px;font-weight:500;padding:1px 7px;border-radius:9999px;background:#e4f3ea;color:#1f6b43}
.rev-pill.old{background:#fbf0d9;color:#8a5a0b}
.rev-pop{position:absolute;top:100%;left:0;margin-top:6px;z-index:20;width:260px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:6px}
.rev-pop .eyebrow{padding:8px 10px 4px}
.rev-opt{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;padding:10px;min-height:44px;border:0;border-radius:8px;background:transparent;text-align:left}
.rev-opt:hover{background:var(--bg)}
.rev-opt.on{background:var(--tint)}
.rev-opt .t{display:flex;flex-direction:column}
.rev-opt .t b{font-size:15px;font-weight:600}
.rev-opt .t span{font-size:12px;color:var(--sec2)}
.rev-opt .tag{font-size:12px;font-weight:500;color:var(--muted)}
.rev-opt .tag.new{color:#1f6b43}
.r-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.btn{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--ctl);background:#fff;color:var(--ink);font-size:15px;font-weight:500}
.btn:hover{border-color:var(--hov);background:var(--subtle)}
.btn.primary{background:var(--green);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--green-h)}
.btn.accent{color:var(--green)}
.btn.accent:hover{border-color:var(--green);background:#fff}
.btn:disabled{opacity:.6;cursor:default}
.old-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;padding:12px 16px;border-radius:10px;background:#fbf0d9;border:1px solid #ecd3a0;color:#8a5a0b;font-size:15px}
.old-banner span{flex:1;min-width:200px}
.old-banner button{height:36px;padding:0 12px;border-radius:7px;border:1px solid #e6c98a;background:#fff;color:#8a5a0b;font-size:14px;font-weight:500}
.chip-toc{display:flex;gap:8px;overflow-x:auto;position:sticky;top:var(--hdr,65px);z-index:10;background:#fff;padding:10px 0;margin-top:8px;border-bottom:1px solid var(--soft2)}
.chip{flex-shrink:0;height:40px;padding:0 14px;border-radius:9999px;border:1px solid var(--ctl);background:#fff;color:var(--ink);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.sec{display:flex;flex-direction:column;gap:20px;padding-top:48px;scroll-margin-top:90px}
.sec h2{font-size:clamp(26px,2.8vw,34px);font-weight:650;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.blk{display:flex;flex-direction:column;gap:12px;scroll-margin-top:90px}
.blk h3{margin-top:16px;font-size:23px;font-weight:600;line-height:30px}
.prose{font-size:18px;line-height:31px;color:var(--body);text-wrap:pretty;white-space:pre-wrap}
.prose strong{color:var(--ink);font-weight:600}
.kv{display:flex;flex-direction:column;gap:18px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:baseline}
.steps li>span:first-child{font-size:17px;font-weight:600;color:var(--green);text-align:right;padding-right:12px}
.steps li>span:last-child{font-size:18px;line-height:31px;color:var(--body);text-wrap:pretty}
.tbl{display:flex;flex-direction:column;gap:10px;margin:6px 0}
.tbl>b{font-size:15px;font-weight:600}
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl table{width:100%;border-collapse:collapse;font-size:16px;min-width:460px}
.tbl th{text-align:left;padding:12px 18px;white-space:nowrap;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--sec2);border-bottom:1px solid var(--line);background:var(--subtle)}
.tbl td{padding:14px 18px;border-bottom:1px solid var(--soft);line-height:24px;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:600;white-space:nowrap}
.callout{display:flex;gap:14px;padding:20px 22px;margin:6px 0;border-radius:10px}
.callout .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.callout .t{font-size:20px;font-weight:600;line-height:26px}
.callout .x{font-size:17px;line-height:28px;color:var(--body);text-wrap:pretty}
.callout.bad{background:#fbf4ee;border:1px solid #f0c9b9}
.callout.bad>.ic,.callout.bad .eyebrow{color:#a23c1a}
.callout.bad .eyebrow{font-weight:600;font-size:12px}
.callout.warn{background:#fbf0d9;border:1px solid #ecd3a0}
.callout.warn>.ic{color:#8a5a0b}
.callout.warn .t{font-size:19px}
.callout>.ic{margin-top:2px}
.arrows{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.arrows li{display:flex;gap:10px;font-size:17px;line-height:28px}
.arrows li>span:first-child{color:#a23c1a;font-weight:700}
.bullets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;padding-left:34px}
.bullets li{display:grid;grid-template-columns:18px minmax(0,1fr);align-items:baseline;font-size:17px;line-height:29px;color:var(--body)}
.bullets li>span:first-child{color:var(--green);font-weight:700}
.bullets li>span:last-child{text-wrap:pretty}
.rev-scroll{max-height:min(360px,60vh);overflow-y:auto}
.signoff{display:flex;flex-direction:column;gap:18px;margin-top:56px;padding-top:28px;border-top:1px solid var(--line)}
.signoff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.signoff-col{display:flex;flex-direction:column;gap:10px}
.signoff-col>b{font-size:14px;font-weight:600}
.person{display:flex;align-items:center;gap:10px}
.notfull{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-top:40px}
.notfull b{font-size:24px;font-weight:600}
.notfull p{max-width:600px}
.kw-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:28px}
.kw-row span{height:28px;display:flex;align-items:center;padding:0 10px;border-radius:9999px;background:var(--tint);color:var(--green);font-size:13px;font-weight:500}
.sidetoc{border-left:1px solid var(--line)}
.sidetoc aside{position:sticky;top:var(--hdr,65px);max-height:calc(100vh - var(--hdr,65px));overflow-y:auto;padding:32px 24px 28px;display:flex;flex-direction:column}
.sidetoc .eyebrow{color:var(--sec2);padding:4px 0 14px}
