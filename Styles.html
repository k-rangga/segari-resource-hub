<style>
/* Segari FC Dashboard design system: flat, text-first, colour only where it carries meaning. */
:root{--bg:#f4f5f2;--surface:#fff;--subtle:#fafbf9;--ink:#1d211f;--body:#3d4440;--sec:#4a524d;--sec2:#5d6560;--muted:#7a837d;--faint:#9aa39d;--faint2:#c5cbc6;
  --line:#e3e6e1;--ctl:#d5d9d4;--hov:#b9c2bb;--soft:#eef0ec;--soft2:#f3f4f1;--green:#1f5f4a;--green-h:#123d2f;--tint:#eef5f1;--ring:0 0 0 3px rgba(31,95,74,.15);
  --page:820px;--orange:#fa980f;--orange-t:#fdf3e3;--pop:0 8px 24px rgba(20,24,22,.14)}
*{box-sizing:border-box}
body{padding-right:var(--edge,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-variant-numeric:tabular-nums}
button{cursor:pointer;color:inherit}
input::placeholder,textarea::placeholder{color:var(--muted)}
h1,h2,h3,p{margin:0}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.eyebrow.lg{font-size:12px;color:var(--sec2)}
.muted{color:var(--muted)}
.page-title{font-size:30px;font-weight:600;line-height:36px;letter-spacing:-.01em}
.ghost{border:0;background:transparent;padding:0}
.ic{display:flex;flex-shrink:0}
.orange{color:var(--orange)}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.hdr-in{padding:10px 32px;display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0;border:0;background:transparent;padding:0;text-align:left}
.brand-t{display:flex;flex-direction:column;border-left:1px solid var(--line);padding-left:12px}
.brand-t b{font-size:16px;font-weight:600;line-height:20px}
.brand-t span{font-size:12px;color:var(--sec2);line-height:16px}
.hdr-mid{position:relative;flex:1;max-width:560px;margin:0 auto}
.hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto}
.hsearch{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border:1px solid var(--ctl);border-radius:10px;background:var(--subtle);color:var(--sec2)}
.hsearch.focus{border-color:var(--green);box-shadow:var(--ring)}
.hsearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink);height:100%}
.pop{position:absolute;top:52px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:6px;z-index:40}
.pop .eyebrow{padding:8px 10px 4px}
.pop-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;min-height:44px;width:100%;border:0;background:transparent;text-align:left}
.pop-row:hover,.pop-row.on{background:var(--bg)}
.pop-row .t i{font-style:normal;font-size:13px;line-height:18px;color:var(--sec);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pop-row>.ic{align-self:flex-start;margin-top:2px}
.pop{max-height:min(520px,70vh);overflow-y:auto}
.pop-row .t{display:flex;flex-direction:column;min-width:0}
.pop-row .t b{font-size:15px;font-weight:500}
.pop-row .t span{font-size:12px;color:var(--sec2)}
.pop-ask{display:flex;align-items:center;gap:10px;padding:12px 10px;margin-top:4px;border:0;border-top:1px solid var(--soft2);background:transparent;width:100%;text-align:left;color:var(--green);font-size:15px;font-weight:500;min-height:44px;border-radius:0 0 8px 8px}
.pop-ask:hover,.pop-ask.on{background:var(--tint)}
.pop-ask .t{display:flex;flex-direction:column;min-width:0}
.pop-ask .t b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-ask .t span{font-size:12px;font-weight:400;color:var(--sec2)}
.pop-empty{padding:8px 10px;font-size:14px;color:var(--sec2)}
.btn-writer{display:flex;align-items:center;gap:8px;height:38px;min-width:38px;justify-content:center;padding:0 14px;margin-right:6px;border-radius:8px;border:1px solid var(--ctl);background:#fff;color:var(--ink);font-size:14px;font-weight:500}
.btn-writer:hover{border-color:var(--green)}
.btn-writer.on{border-color:var(--green);background:var(--tint);color:var(--green)}
.avatar{border-radius:50%;background:#e4f3ea;color:#194e3d;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.user-t{display:flex;flex-direction:column}
.user-t b{font-size:14px;font-weight:600;line-height:18px}
.user-t span{font-size:12px;color:var(--sec2);line-height:16px}

/* main + page transition */
.main{max-width:1200px;margin:0 auto;padding:32px 32px 120px}
.main.reader{max-width:none;padding:0}
.anim{transition:opacity .3s ease,transform .3s ease}
.anim.out{opacity:0;transform:translateY(8px)}

/* text-link tabs */
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line)}
.tabs.center{justify-content:center;max-width:var(--page);margin:0 auto}
.tabs.sm{gap:24px}
.tab{display:flex;align-items:baseline;gap:6px;height:44px;padding:0 2px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--sec2);font-size:15px;font-weight:500}
.tab:hover{color:var(--ink)}
.tab.on{border-bottom-color:var(--green);color:var(--ink);font-weight:600}
.tab .n{font-size:12px;color:var(--muted);font-weight:500}

/* home: search */
.hero{display:flex;flex-direction:column;align-items:center;gap:22px;transition:padding-top .3s ease}
.hero-bar{width:100%;max-width:var(--page);display:flex;align-items:center;gap:12px;height:64px;padding:0 10px 0 22px;border:1px solid var(--ctl);border-radius:14px;background:#fff;color:var(--muted);transition:box-shadow .15s,border-color .15s}
.hero-bar.focus{border-color:var(--green);box-shadow:var(--ring)}
.hero-bar input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:19px;color:var(--ink);height:100%}
.keycap{display:flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-weight:600;color:var(--muted)}
.icon-btn{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.spark-btn{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.spark-btn:hover{background:var(--orange-t)}
.examples{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.ex-link{border:0;background:transparent;padding:2px 0;font-size:15px;line-height:22px;color:var(--sec2)}
.ex-link:hover{color:var(--green);text-decoration:underline}
.results{width:100%;max-width:var(--page);margin:36px auto 0;display:flex;flex-direction:column;gap:20px}
.ans{display:flex;flex-direction:column;gap:18px;padding-top:28px}
.ans-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;flex-wrap:wrap}
.ans-label .q{font-weight:400;color:var(--muted)}
.ans-intro{font-size:22px;line-height:31px;font-weight:600;text-wrap:pretty}
.numlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.numlist li{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:baseline;font-size:17px;line-height:28px;color:var(--body)}
.numlist li>span:first-child{font-weight:600;color:var(--green)}
.numlist li>span:last-child{text-wrap:pretty}
.ans-note{overflow-wrap:anywhere;font-size:15px;line-height:23px;color:#8a5a0b;padding-left:14px;border-left:2px solid #ecd3a0}
.src-links{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.src-link{display:flex;align-items:center;gap:6px;align-self:flex-start;border:0;background:transparent;padding:4px 0;font-size:15px;font-weight:500;color:var(--green);text-align:left;min-height:32px}
.src-link:hover{text-decoration:underline}
.ans-foot{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line)}
.link-strong{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:4px 0;font-size:15px;font-weight:600;color:var(--ink);min-height:44px}
.link-strong:hover{color:var(--green)}
.disclaimer{font-size:12px;color:var(--muted);line-height:16px}
.typing{align-self:flex-start;display:flex;align-items:center;gap:10px;padding:4px 0;font-size:15px;color:var(--sec2)}
.dot{width:8px;height:8px;border-radius:9999px;background:#2f9e6a;animation:pulse 1.4s ease-in-out infinite;flex-shrink:0}
.dot.ring{box-shadow:0 0 0 3px rgba(47,158,106,.25)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* the one list row: browse, search results, keyword hits */
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 4px;min-height:44px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:var(--ink)}
.row:hover b{color:var(--green)}
.row .t{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.row b{font-size:16px;font-weight:600;line-height:22px;text-wrap:pretty}
.row .meta{font-size:13px;line-height:18px;color:var(--sec2)}
.row .ex{font-size:14px;line-height:21px;color:var(--sec);margin-top:2px}
.row i{color:var(--faint);display:flex}
mark{background:#fde9c4;color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:16px 0;font-size:15px;color:var(--sec2)}

/* home: browse */
.browse{width:100%;max-width:var(--page);margin:40px auto 0;display:flex;flex-direction:column;gap:18px}
.field-search{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 16px;border:1px solid var(--ctl);border-radius:10px;background:#fff;color:var(--muted)}
.field-search.focus{border-color:var(--green);box-shadow:var(--ring)}
.field-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink);height:100%}
.field-search .icon-btn{width:34px;height:34px;border-radius:8px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:9999px;border:1px solid var(--ctl);background:#fff;color:var(--ink);font-size:14px;font-weight:500}
.pill:hover{border-color:var(--green)}
.pill .n{font-size:12px;opacity:.7}
.pill.on{background:var(--green);border-color:var(--green);color:#fff}
.pill.sm{height:36px}
.pill.tint.on{background:var(--tint);border-color:var(--green);color:var(--green)}
.area-groups{display:flex;flex-direction:column;gap:28px;padding-top:6px}
.area-group{display:flex;flex-direction:column;gap:8px;scroll-margin-top:90px}
.area-group h2{font-size:15px;font-weight:600;line-height:22px;color:var(--sec)}
.area-empty{padding:12px 4px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line)}

/* breadcrumb */
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:14px;color:var(--sec2)}
.crumbs .sep{color:var(--faint);padding:0 2px}
.crumb{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:var(--sec);font-size:14px}
.crumb:hover{background:var(--bg);color:var(--ink)}
.crumb-pill{padding:6px 12px;border-radius:9999px;background:var(--tint);color:var(--green);font-weight:500}

/* page heading on the results page */
.list-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.list-head h1{font-size:28px;font-weight:600;line-height:34px}
.tile{width:44px;height:44px;border-radius:10px;background:var(--bg);color:var(--sec);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.res-ask{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:#fff}
.res-ask .t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:200px}
.res-ask .t b{font-size:15.5px;font-weight:600}
.res-ask .t span{font-size:13.5px;color:var(--sec2)}

/* reader */
.reader-grid{background:#fff;display:grid;min-height:calc(100vh - var(--hdr,65px))}
.article{min-width:0;padding:28px 56px 80px}
.article-in{max-width:960px;display:flex;flex-direction:column}
.rev-static{font-weight:500;color:var(--ink)}
.r-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:20px}
.r-line{margin-top:8px;font-size:13.5px;line-height:20px;color:var(--sec2)}
.r-line b{font-weight:600;color:var(--green)}
.r-title{margin-top:6px;font-size:clamp(28px,3.2vw,36px);font-weight:650;line-height:1.15;letter-spacing:-.015em;text-wrap:pretty}
.r-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.r-head-t{display:flex;flex-direction:column;min-width:0;flex:1}
.r-facts{display:flex;flex-wrap:wrap;margin:22px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.r-facts>div{display:flex;flex-direction:column;gap:3px;padding:12px 24px 12px 0;margin-right:24px;border-right:1px solid var(--soft)}
.r-facts>div:last-child{border-right:0;margin-right:0;flex:1 1 200px}
.r-facts dt{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.r-facts dd{margin:0;font-size:14.5px;line-height:21px;color:var(--ink);font-weight:500}
.r-facts dd.code{color:var(--green);font-weight:600}
.btn.icon{width:38px;height:38px;padding:0;justify-content:center;color:var(--sec)}
.btn.icon:hover{color:var(--green)}
.doc-link{color:var(--green);text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:rgba(31,95,74,.2);text-underline-offset:3px}
.doc-link:hover{text-decoration-color:var(--green)}
@media (max-width:899px){.r-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.r-facts>div{border-right:0;margin-right:0;border-bottom:1px solid var(--soft)}.r-facts>div.wide{grid-column:1 / -1;border-bottom:0}}.r-actions{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
.btn{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--ctl);background:#fff;color:var(--ink);font-size:15px;font-weight:500}
.btn:hover{border-color:var(--hov);background:var(--subtle)}
.btn.primary{background:var(--green);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--green-h)}
.btn.accent{color:var(--green)}
.btn.accent:hover{border-color:var(--green);background:#fff}
.btn:disabled{opacity:.6;cursor:default}
.toc-bar{display:flex;align-items:center;gap:8px;position:sticky;top:var(--hdr,65px);z-index:10;width:100%;height:44px;margin-top:14px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--sec);text-align:left;font-size:14px}
.toc-bar b{font-weight:600;color:var(--ink);flex-shrink:0}
.toc-bar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sec2)}
.sheet{position:fixed;left:0;right:var(--edge,0px);bottom:0;z-index:60;max-height:72vh;overflow-y:auto;padding:0 0 20px;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -12px 32px rgba(20,24,22,.2)}
.sheet-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 18px;background:#fff;border-bottom:1px solid var(--line)}
.sheet-head b{font-size:16px;font-weight:600}
.hit{background:#fde9c4;box-shadow:0 0 0 6px #fde9c4;border-radius:4px;transition:background .5s,box-shadow .5s}
tr.hit td{background:#fde9c4!important}
.sec{display:flex;flex-direction:column;gap:16px;padding-top:52px;scroll-margin-top:90px}
.sec h2{font-size:clamp(22px,2.1vw,26px);font-weight:650;line-height:1.3;letter-spacing:-.01em;color:#2f3431;text-wrap:balance}
.sec-h{position:relative}
.sec-h .anchor{position:absolute;left:-36px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:6px;background:transparent;color:var(--faint);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.sec-h:hover .anchor,.sec-h .anchor:focus-visible{opacity:1}
.sec-h .anchor:hover{color:var(--green);background:var(--soft2)}
@media (hover:none),(max-width:1023px){.sec-h .anchor{display:none}}
.blk{display:flex;flex-direction:column;gap:12px;scroll-margin-top:90px}
.blk h3{margin-top:12px;font-size:16.5px;font-weight:650;line-height:26px;color:#2f3431}
.prose{font-size:16px;line-height:28px;color:var(--body);text-wrap:pretty;white-space:pre-wrap}
.prose strong{color:var(--ink);font-weight:600}
.kv{display:flex;flex-direction:column;gap:18px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:baseline}
.steps li>span:first-child{font-size:17px;font-weight:600;color:var(--green);text-align:right;padding-right:12px}
.steps li>span:last-child{font-size:16px;line-height:28px;color:var(--body);text-wrap:pretty}
.tbl{display:flex;flex-direction:column;gap:10px;margin:6px 0}
.tbl>b{font-size:15px;font-weight:600}
.tbl-scroll{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:15px;min-width:520px;border:1px solid var(--ctl)}
.tbl th{text-align:left;padding:12px 16px;font-size:15px;font-weight:650;color:var(--ink);background:#f6f7f8;border:1px solid var(--ctl);border-bottom-width:2px;vertical-align:middle}
.tbl td{padding:12px 16px;border:1px solid var(--ctl);line-height:24px;color:var(--body);vertical-align:middle;text-wrap:pretty}
.tbl tbody tr:nth-child(even) td{background:#fbfbfc}
.callout{display:flex;gap:14px;padding:20px 22px;margin:6px 0;border-radius:10px}
.callout .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.callout .t{font-size:20px;font-weight:600;line-height:26px}
.callout .x{font-size:17px;line-height:28px;color:var(--body);text-wrap:pretty}
.callout.bad{background:#fbf4ee;border:1px solid #f0c9b9}
.callout.bad>.ic,.callout.bad .eyebrow{color:#a23c1a}
.callout.bad .eyebrow{font-weight:600;font-size:12px}
.callout.warn{background:#fbf0d9;border:1px solid #ecd3a0}
.callout.warn>.ic{color:#8a5a0b}
.callout.warn .t{font-size:19px}
.callout>.ic{margin-top:2px}
.arrows{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.arrows li{display:flex;gap:10px;font-size:17px;line-height:28px}
.arrows li>span:first-child{color:#a23c1a;font-weight:700}
.bullets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;padding-left:24px}
.bullets li{display:grid;grid-template-columns:18px minmax(0,1fr);align-items:baseline;font-size:16px;line-height:28px;color:var(--body)}
.bullets li>span:first-child{color:var(--ink);font-weight:700}
.bullets li>span:last-child{text-wrap:pretty}
.signoff{display:flex;flex-direction:column;gap:18px;margin-top:56px;padding-top:28px;border-top:1px solid var(--line)}
.signoff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.signoff-col{display:flex;flex-direction:column;gap:10px}
.signoff-col>b{font-size:14px;font-weight:600}
.person{display:flex;align-items:center;gap:10px}
.notfull{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-top:40px}
.notfull b{font-size:24px;font-weight:600}
.notfull p{max-width:600px}
.kw-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:28px}
.kw-row span{height:28px;display:flex;align-items:center;padding:0 10px;border-radius:9999px;background:var(--tint);color:var(--green);font-size:13px;font-weight:500}
.sidetoc{border-right:1px solid var(--line)}
.sidetoc aside{position:sticky;top:var(--hdr,65px);max-height:calc(100vh - var(--hdr,65px));overflow-y:auto;padding:20px 0 28px;display:flex;flex-direction:column}
.sidetoc .eyebrow{color:var(--sec2);padding:4px 18px 10px;font-size:11.5px}
.sidetoc .ask-card{margin:22px 20px 0}
.toc{display:flex;flex-direction:column}
.toc-item{display:flex;flex-direction:column}
.toc-row{display:flex;align-items:flex-start;width:100%;border:0;background:transparent;text-align:left;padding:0;color:#333a36;cursor:pointer}
.toc-row:hover{background:var(--soft2)}
.toc-row.on{background:var(--soft)}
.toc-link{flex:1;min-width:0;padding:10px 4px 10px 18px;font-size:14.5px;line-height:21px;color:inherit}
.toc-row.on .toc-link{color:var(--green)}
.toc-chev{flex-shrink:0;width:36px;height:41px;color:var(--sec);display:flex;align-items:center;justify-content:center}
.toc-row:hover .toc-chev{color:var(--ink)}
.toc-subs{display:flex;flex-direction:column}
.toc-sub{text-align:left;border:0;background:transparent;padding:9px 16px 9px 34px;font-size:14px;line-height:20px;color:#3d4440;width:100%}
.toc-sub:hover{background:var(--soft2)}
.toc-sub.on{color:var(--green);background:var(--soft)}
.ask-card{margin-top:22px;display:flex;align-items:flex-start;gap:10px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--subtle)}
.ask-card:hover{border-color:var(--green)}
.ask-card .t{display:flex;flex-direction:column;gap:2px}
.ask-card .t b{font-size:14px;font-weight:600}
.ask-card .t span{font-size:13px;color:var(--sec2);line-height:18px}
.spark-tile{border-radius:8px;background:var(--green-h);color:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* floating button */
.fab{position:fixed;right:24px;bottom:24px;z-index:40;display:flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 6px;border-radius:9999px;border:1px solid rgba(255,255,255,.12);background:var(--green-h);color:#fff;box-shadow:0 8px 24px rgba(20,24,22,.24)}
.fab:hover{background:#194e3d}
.fab .c{width:34px;height:34px;border-radius:9999px;background:rgba(255,255,255,.08);color:var(--orange);display:flex;align-items:center;justify-content:center}
.fab b{font-size:14.5px;font-weight:600;line-height:20px;white-space:nowrap}

/* chat drawer */
.scrim{position:fixed;inset:0;background:rgba(29,33,31,.3);z-index:50}
.drawer{position:fixed;top:0;right:var(--edge,0px);bottom:0;width:480px;max-width:100vw;z-index:60;background:#fff;display:flex;flex-direction:column;box-shadow:0 25px 50px -12px rgba(20,24,22,.35);transform:translateX(105%);transition:transform .36s cubic-bezier(.3,.8,.4,1);visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer.dragging{transition:none;user-select:none}
.d-resize{position:absolute;left:-6px;top:0;bottom:0;width:12px;cursor:ew-resize;z-index:2;display:flex;align-items:center;justify-content:center;touch-action:none}
.d-resize span{width:4px;height:44px;border-radius:9999px;background:var(--faint2);opacity:0;transition:opacity .15s,background .15s}
.drawer:hover .d-resize span,.d-resize:focus-visible span{opacity:1}
.d-resize:hover span,.drawer.dragging .d-resize span{background:var(--green);opacity:1}
.d-resize:focus-visible{outline:none}
.drawer:not(.open){transition:transform .36s cubic-bezier(.3,.8,.4,1),visibility 0s .36s}
.d-head{background:#fff;color:var(--ink);padding:14px 10px 14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.d-tile{width:32px;height:32px;border-radius:9px;background:var(--green-h);color:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.d-name{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.badge-ai{font-size:10px;font-weight:600;letter-spacing:.08em;padding:2px 7px;border-radius:9999px;border:1px solid rgba(255,255,255,.24);color:#e6f0ea}
.d-status{display:flex;align-items:center;gap:7px;font-size:13px;color:#b9d0c3;line-height:18px}
.d-btn{width:38px;height:38px;border-radius:9px;border:0;background:transparent;color:var(--sec2);display:flex;align-items:center;justify-content:center}
.d-btn:hover{background:var(--soft2);color:var(--ink)}
.d-sub{display:flex;align-items:center;gap:8px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--subtle);font-size:13px;color:var(--sec2)}
.d-sub .ic{color:var(--green)}
.d-body{position:relative;flex:1;overflow-y:auto;padding:28px 24px 32px;display:flex;flex-direction:column;gap:24px}
.thinking{display:flex;flex-direction:column;gap:8px;padding:2px 0}
.think-step{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:20px;color:var(--sec);animation:thinkIn .25s ease-out}
.think-step.done{color:var(--muted)}
.think-step .mark{width:16px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--green)}
@keyframes thinkIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.hello{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.hello b{font-size:22px;font-weight:600;line-height:28px;letter-spacing:-.01em}
.hello span{font-size:15px;line-height:23px;color:var(--sec2);text-wrap:pretty}
.msg-user{align-self:flex-end;max-width:min(80%,520px);overflow-wrap:anywhere;padding:10px 14px;border-radius:18px;background:var(--soft2);font-size:15px;line-height:22px;color:var(--ink);text-wrap:pretty}
.msg-ai{display:flex;flex-direction:column;gap:10px;min-width:0;overflow-wrap:anywhere}
.msg-ai>*{max-width:68ch}
.msg-ai .who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.msg-ai .intro{font-size:15.5px;line-height:24px;font-weight:400;color:var(--ink);text-wrap:pretty}
.msg-note{overflow-wrap:anywhere;font-size:14px;line-height:21px;color:#8a5a0b;border-left:2px solid #e2b867;padding:2px 0 2px 12px}
.src-cards{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.src-card{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:left;width:100%}
.src-card:hover{border-color:var(--green);background:var(--subtle)}
.src-card .tile{width:32px;height:32px;border-radius:8px;background:var(--tint);color:var(--green)}
.src-card b{flex:1;font-size:14px;line-height:19px;font-weight:500;text-wrap:pretty}
.src-card>.ic{color:var(--green)}
.prompt-list{display:flex;flex-direction:column}
.prompt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:10px 0;min-height:44px;border:0;background:transparent;color:var(--sec);font-size:14.5px;line-height:21px;width:100%}
.prompt-row:hover{color:var(--ink)}
.prompt-row:hover .ic{color:var(--green)}
.prompt-skel{display:block;height:14px;margin:15px 0;border-radius:6px;background:var(--soft);animation:pulse 1.4s ease-in-out infinite}
.prompt-skel:nth-child(3){width:80%}
.prompt-skel:nth-child(4){width:64%}
.votes{display:flex;align-items:center;gap:4px;min-height:32px;font-size:13px;color:var(--muted)}
.votes>span{margin-right:4px}
.vote{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.vote:hover{background:var(--soft2);color:var(--green)}
.prompt-head{font-size:12.5px;color:var(--muted);padding-bottom:2px}
.d-name>b{font-size:16px;font-weight:600;line-height:20px}
.d-ctx{font-size:12.5px;line-height:17px;color:var(--sec2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-ctx b{font-weight:500;color:var(--green)}
.ans-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:23px;color:var(--body)}
.ans-list li{padding-left:4px;text-wrap:pretty}
.ans-list li::marker{color:var(--muted);font-size:13.5px}
.src-chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:2px}
.src-chip{display:flex;align-items:center;gap:6px;max-width:100%;height:30px;padding:0 10px;border-radius:9999px;border:1px solid var(--line);background:#fff;color:var(--sec);font-size:12.5px;text-align:left}
.src-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-chip:hover{border-color:var(--green);color:var(--green)}
.send:disabled{background:var(--soft);color:var(--faint);cursor:default}
.prompt-row .t{flex:1;min-width:0;text-wrap:pretty}
.prompt-row .ic{color:var(--faint);transition:transform .15s,color .15s}
.prompt-row:hover .ic{transform:translate(2px,-2px)}
.composer{display:flex;flex-direction:column;gap:8px;padding:12px 20px 16px;background:#fff}
.composer-box{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 16px;border:1px solid var(--ctl);border-radius:9999px;background:#fff}
.composer-box:hover{border-color:var(--hov)}
.composer-box.focus{border-color:var(--green);box-shadow:var(--ring)}
.composer-box input{flex:1;min-width:0;height:44px;border:0;font-size:16px;outline:none;background:transparent;color:var(--ink)}
.send{width:36px;height:36px;border-radius:9999px;border:0;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send:hover{background:var(--green-h)}

/* writer */
.writer{width:100%;max-width:var(--page);margin:8px auto 0;display:flex;flex-direction:column;gap:40px}
.w-sec{display:flex;flex-direction:column;gap:18px}
.w-head{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.w-head .n{font-size:15px;font-weight:600;color:var(--green)}
.w-head b{font-size:18px;font-weight:600;flex:1}
.text-btn{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:4px 0;font-size:14px;font-weight:500;color:var(--green);min-height:36px}
.text-btn:hover{text-decoration:underline}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.field>label{font-size:13px;font-weight:500;color:var(--sec)}
.editor{display:flex;flex-direction:column;border:1px solid var(--ctl);border-radius:10px;background:#fff}
.editor:focus-within{border-color:var(--green);box-shadow:var(--ring)}
.editor .textarea{border:0;border-radius:0 0 10px 10px;box-shadow:none}
.editor .textarea:focus{box-shadow:none}
.editor-fail{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);background:#fbf0d9;border-radius:10px 10px 0 0;font-size:14px;color:#8a5a0b}
.ed-bars{position:sticky;top:var(--hdr,65px);z-index:5;background:var(--subtle);border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.ed-bar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:5px 6px}
.tb{width:36px;height:36px;border:0;border-radius:7px;background:transparent;color:var(--sec);display:flex;align-items:center;justify-content:center}
.tb:hover:not(:disabled){background:var(--soft);color:var(--ink)}
.tb.on{background:var(--tint);color:var(--green)}
.tb:disabled{color:var(--faint2);cursor:default}
.tb-sep{width:1px;height:20px;margin:0 5px;background:var(--line)}
.tb-style{height:36px;padding:0 6px;border:0;border-radius:7px;background:transparent;color:var(--ink);font-family:inherit;font-size:14px;cursor:pointer}
.tb-style:hover:not(:disabled){background:var(--soft)}
.tb-style:disabled{color:var(--faint);cursor:default}
.ed-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid var(--line)}
.ed-sub .input{flex:1;min-width:200px}
.ed-sub-l{font-size:12.5px;font-weight:600;color:var(--sec2);margin-right:4px}
.tb-text{height:32px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--sec);font-size:13.5px;font-weight:500;white-space:nowrap}
.tb-text:hover{background:var(--soft);color:var(--ink)}
.tb-text.strong{color:var(--green);font-weight:600}
.tb-text.danger{color:#a23c1a}
.ed-loading{display:flex;align-items:center;gap:10px;min-height:320px;padding:18px 22px;align-items:flex-start;font-size:14px;color:var(--sec2)}
.ed-host{min-width:0}
.ed-stage{position:relative;min-width:0}
.editor.free .pm{padding-left:58px;border-radius:10px}
.ed-link{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.ed-link .input{flex:1;min-width:190px}
.ed-handle{position:absolute;left:6px;z-index:6;display:flex;align-items:center;margin-top:1px}
.eh-btn{width:24px;height:26px;border:0;border-radius:5px;background:transparent;color:var(--faint);display:flex;align-items:center;justify-content:center}
.eh-btn:hover{background:var(--soft);color:var(--ink)}
.eh-btn.grip{cursor:grab}
.ed-pop{position:absolute;z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop)}
.slash,.block-menu,.style-menu{display:flex;flex-direction:column;width:232px;padding:6px}
.slash{width:280px}
.block-menu{top:30px;left:0}
.style-menu{top:38px;left:-4px}
.sl-group{padding:8px 8px 4px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sl-row{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:4px 8px;border:0;border-radius:7px;background:transparent;color:var(--ink);font-size:14.5px;text-align:left}
.sl-row:hover,.sl-row.on{background:var(--soft2)}
.sl-row.danger{color:#a23c1a}
.sl-tile{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--sec);font-size:12px;font-weight:600}
.sl-line{height:1px;margin:6px 4px;background:var(--line)}
.sl-none{padding:10px;font-size:14px;color:var(--muted)}
.bubble{display:flex;align-items:center;gap:2px;width:max-content;max-width:calc(100% - 16px);min-height:44px;padding:4px 6px}
.bubble .ed-link{min-width:400px}
.bb-style{position:relative}
.bb-style>.tb-text{display:flex;align-items:center;gap:4px;height:36px;color:var(--ink)}
.bb-style>.tb-text:disabled{color:var(--faint);cursor:default}
.table-bar{display:flex;align-items:center;gap:2px;padding:3px 4px;width:max-content;max-width:100%}
.pm .is-empty::before{content:attr(data-placeholder);float:left;height:0;color:var(--faint);pointer-events:none}
.pm .ProseMirror-selectednode{outline:2px solid rgba(31,95,74,.25);outline-offset:2px;border-radius:4px}
/* the page as readers will see it */
.pm{min-height:360px;padding:18px 24px 32px;outline:none;font-size:16px;line-height:28px;color:var(--body);overflow-wrap:anywhere}
.pm p{margin:0}
.pm>p+p,.pm>h1+p,.pm>h2+p,.pm>ol+p,.pm>ul+p,.pm>.tableWrapper+p{margin-top:12px}
.pm strong{color:var(--ink);font-weight:600}
.pm h1{margin:28px 0 0;font-size:24px;font-weight:650;line-height:1.3;letter-spacing:-.01em;color:#2f3431}
.pm h1:first-child{margin-top:0}
.pm h2{margin:20px 0 0;font-size:16.5px;font-weight:650;line-height:26px;color:#2f3431}
.pm ol,.pm ul{margin:12px 0 0;padding-left:30px}
.pm li{margin-top:6px;padding-left:4px}
.pm ol>li::marker{font-weight:600;color:var(--green)}
.pm table{width:100%;margin-top:14px;border-collapse:collapse;table-layout:fixed;font-size:15px;line-height:24px;border:1px solid var(--ctl)}
.pm th,.pm td{padding:10px 14px;border:1px solid var(--ctl);vertical-align:top;text-align:left;position:relative}
.pm th{font-weight:650;color:var(--ink);background:#f6f7f8}
.pm .selectedCell{background:var(--tint)}
.pm .tableWrapper{overflow-x:auto;margin-top:14px}
.pm .tableWrapper table{margin-top:0}
.pm .ProseMirror-gapcursor{display:none}
.w-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 20px;flex-wrap:wrap}
.w-status{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13px;color:var(--sec2);min-height:32px}
.w-status>span{margin-right:6px}
.w-status .warn{color:#8a5a0b}
.draft-note{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;padding:10px 14px;border:1px solid #ecd3a0;border-radius:10px;background:#fdf8ec;font-size:14.5px;color:var(--body)}
.draft-note>span{flex:1;min-width:220px}
.draft-note b{font-weight:600}
.w-drafts{display:flex;flex-direction:column;gap:10px}
.draft-row{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.draft-row .row{border-bottom:0;flex:1;min-width:0}
.helper.sm{font-size:12px;color:var(--muted)}
.input{height:46px;padding:0 14px;border:1px solid var(--ctl);border-radius:8px;font-size:16px;color:var(--ink);outline:none;background:#fff;min-width:0;width:100%}
.input:focus,.textarea:focus{border-color:var(--green);box-shadow:var(--ring)}
.input.sm{height:40px;padding:0 12px;font-size:14px}
.textarea{min-height:260px;padding:14px;border:1px solid var(--ctl);border-radius:8px;font-size:16px;line-height:26px;color:var(--ink);outline:none;resize:vertical;background:#fff}
.ver-row{display:flex;align-items:center;gap:20px;padding:6px 0;flex-wrap:wrap}
.ver-date{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sec2)}
.ver-date .input{width:180px}
.auto-log{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--subtle);font-size:14.5px;line-height:22px;color:var(--sec)}
.changelog{gap:6px}
.log-entry{display:flex;flex-direction:column;gap:10px;padding:20px 0 8px}
.log-entry h3{font-size:18px;font-weight:650;line-height:26px;color:#2f3431}
.log-date{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.log-date b{font-size:15px;font-weight:650;color:var(--ink)}
.log-tag{height:26px;display:flex;align-items:center;padding:0 10px;border-radius:9999px;background:var(--tint);color:var(--green);font-size:12.5px;font-weight:500}
.log-empty{font-size:16px;color:var(--muted)}
.changelog .bullets{padding-left:6px}
.ver-rev{display:flex;flex-direction:column;gap:2px}
.ver-rev b{font-size:15px;font-weight:600}
.ver-rev span{font-size:11px;font-weight:500;color:var(--muted)}
.ver-rev span.new{color:#1f6b43}
.ver-rm{width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.ver-rm:hover{background:var(--bg);color:#a23c1a}
.ver-rm[hidden]{display:flex;visibility:hidden}
.helper{font-size:14px;color:var(--sec2)}
.tagbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:48px;padding:6px 10px;border:1px solid var(--ctl);border-radius:8px;background:#fff}
.tagbox.focus{border-color:var(--green);box-shadow:var(--ring)}
.tagbox input{flex:1;min-width:160px;height:34px;border:0;outline:0;font-size:15px;color:var(--ink);background:transparent}
.chip-kw{display:flex;align-items:center;gap:4px;height:30px;padding:0 6px 0 12px;border-radius:9999px;background:var(--tint);color:var(--green);font-size:13px;font-weight:500}
.chip-kw button{width:22px;height:22px;border:0;border-radius:9999px;background:transparent;color:var(--green);display:flex;align-items:center;justify-content:center}
.chip-kw button:hover{background:#d6e9de}
.suggest{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.suggest>span{font-size:13px;color:var(--muted)}
.sug{height:30px;padding:0 12px;border-radius:9999px;border:1px dashed var(--faint2);background:transparent;color:var(--sec);font-size:13px}
.sug:hover{border-color:var(--green);color:var(--green)}
.w-foot{display:flex;justify-content:flex-end;gap:10px;padding-top:20px;border-top:1px solid var(--line)}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:10px;background:var(--ink);color:#fff;font-size:15px;box-shadow:var(--pop);max-width:calc(100vw - 32px)}

/* focus: green border + soft ring */
button:focus-visible,a:focus-visible{outline:none;box-shadow:var(--ring);border-color:var(--green)}

/* responsive */
@media (max-width:899px){.hide-md{display:none!important}}
@media (max-width:639px){
  .hide-sm{display:none!important}
  .hdr-in{padding:8px 12px;gap:8px;min-height:56px}
  .hdr-mid{min-width:0;margin:0}
  .hsearch{height:40px;padding:0 12px;gap:8px}
  .btn-writer{padding:0;width:40px;height:40px;margin-right:0}
  .main{padding:20px 16px 120px}
  .page-title{font-size:26px;line-height:32px}
  .hero-bar{height:58px;padding:0 6px 0 16px}
  .hero-bar input{font-size:17px}
